l_german:
 game_rule_category_DI_interface: "Divine Intervention"
 rule_DI_button_position: "Divine Intervention: Schaltflächenposition"
 setting_DI_button_position_sidebar: "Rechte Spalte"
 setting_DI_button_position_sidebar_desc: "Platziert die Divine-Intervention-Schaltfläche unter der letzten sichtbaren Schaltfläche der normalen Seitenleiste."
 setting_DI_button_position_new_column: "Linke Spalte"
 setting_DI_button_position_new_column_desc: "Platziert die Divine-Intervention-Schaltfläche in einer eigenen Spalte links neben der Seitenleiste. Hilfreich, wenn eine andere Oberflächenmod die Standardposition überlagert."
 DI_button_position_interaction: "#color_yellow #bold (DI)#!#! Position der Menüschaltfläche"
 DI_button_position_interaction_desc: "Wählt die Spalte der Menüschaltfläche für eure DI-Einstellungen. Diese Einstellung hat Vorrang vor der Spielregel. Mit Spielregel verwenden wird der Kampagnenstandard wiederhergestellt."
 DI_button_position_use_rule: "Spielregel verwenden"
 DI_button_position_apply: "Anwenden"
 DI_button_position_move_up: "Ein Feld nach oben"
 DI_button_position_move_up_desc: "Bewegt die Schaltfläche um einen Platz nach oben und überspringt kleine Abstände. Stoppt oben und behält die Spaltenwahl bei."
 DI_button_position_move_down: "Ein Feld nach unten"
 DI_button_position_move_down_desc: "Bewegt die Schaltfläche um einen Platz nach unten und überspringt kleine Abstände. Stoppt an der normalen unteren Position und behält die Spaltenwahl bei."
 DI_button_position_move_top: "Ganz nach oben"
 DI_button_position_move_top_desc: "Entfernt sofort alle Abstände über der Schaltfläche. Die Spaltenwahl bleibt erhalten."
 DI_button_position_move_bottom: "Ganz nach unten"
 DI_button_position_move_bottom_desc: "Stellt sofort alle Abstände über der Schaltfläche wieder her. Die Spaltenwahl bleibt erhalten."
 DI_button_position_event_desc: "Passt die Position der Menüschaltfläche an. Änderungen gelten sofort und dieses Fenster öffnet sich nach jeder Auswahl erneut. Schließt es, wenn ihr fertig seid. Spielregel verwenden stellt die Standardspalte wieder her, ohne die Höhe zurückzusetzen."
 DI_button_position_close: "Schließen"
