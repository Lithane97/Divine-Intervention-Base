l_german:
 DI_dm_tab:0 "Domizile"
 DI_dm_load_pinned:0 "Angeheftete Charaktere laden"
 DI_dm_load_self:0 "Meine Domizile"
 DI_dm_refresh:0 "Aktualisieren"
 DI_dm_select_all:0 "Alle auswählen"
 DI_dm_clear:0 "Auswahl aufheben"
 DI_dm_counts:0 "Ausgewählt: [GetPlayer.MakeScope.Var('DI_dm_selected_count').GetValue] / [GetPlayer.MakeScope.Var('DI_dm_candidate_count').GetValue] | Angezeigt: [GetPlayer.MakeScope.Var('DI_dm_shown_count').GetValue]"
 DI_dm_filter_all_loc:0 "Alle Domizilarten"
 DI_dm_filter_help:0 "Die Liste der geladenen Domizile nach Art filtern. Beim Ändern des Filters bleiben bestehende Auswahlen erhalten, auch ausgeblendete. Aktionen betreffen alle ausgewählten Domizile."
 DI_dm_select_all_tt:0 "Die aktuelle Auswahl durch alle Domizile ersetzen, die der aktive Filter anzeigt."
 DI_dm_selection_help:0 "Die zu bearbeitenden Domizile markieren. Gemeinsam genutzte Domizile erscheinen nur einmal."
 DI_dm_upgrade:0 "Bestehende Gebäude ausbauen"
 DI_dm_upgrade_tt:0 "Bestehende Gebäude in ausgewählten Domizilen sofort ausbauen. Stoppt an verzweigten Ausbaupfaden. Fügt keine Innengebäude hinzu und ersetzt keine anderen Gebäude. Überspringt Domizile mit laufenden Bauvorhaben."
 DI_dm_construct_help:0 "Gebäude errichten - Art und Stufe wählen"
 DI_dm_construct:0 "Gebäude errichten"
 DI_dm_construction_title:0 "Domizilbau"
 DI_dm_level_selector:0 "Gebäudestufe"
 DI_dm_level_selector_tt:0 "Gilt für alle Gebäudeschaltflächen. Max wählt die höchste Stufe. Kürzere Gebäudeketten verwenden ihre höchste verfügbare Stufe, wenn die gewählte Stufe darüber liegt."
 DI_dm_level_max:0 "Max"
 DI_dm_last_action:0 "Letzte Aktion: [GetPlayer.MakeScope.Var('DI_dm_changed_count').GetValue] Gebäudeänderungen"
 DI_dm_construct_tt:0 "Linksklick zum Errichten oder Festlegen der gewählten Stufe, auch zum Herabstufen. Rechtsklick entfernt das Gebäude ohne Rückerstattung; das Hauptgebäude wird auf Stufe 1 zurückgesetzt. Das Entfernen eines Außengebäudes entfernt dessen Innengebäude. Domizile mit laufenden Bauvorhaben oder inkompatible Domizile werden übersprungen. Beim Hinzufügen von Gebäuden gelten weiterhin die Bauvoraussetzungen des Spiels."
 DI_dm_building_actions_tt:0 "Linksklick: Gewählte Stufe festlegen (errichten, ausbauen oder herabstufen).\nRechtsklick: Dieses Gebäude ohne Rückerstattung entfernen. Das Entfernen eines übergeordneten Gebäudes entfernt auch dessen Innengebäude.\nHerabstufen kann die Anzahl der Innengebäudeplätze verringern.\n\n"
 DI_dm_main_building_actions_tt:0 "Linksklick: Gewählte Stufe festlegen (ausbauen oder herabstufen).\nRechtsklick: Hauptgebäude ohne Rückerstattung auf Stufe 1 zurücksetzen.\nHerabstufen kann die Anzahl der Innengebäudeplätze verringern.\n\n"
 DI_dm_slot_main:0 "Hauptgebäude"
 DI_dm_slot_external:0 "Außengebäude"
 DI_dm_slot_internal:0 "Innengebäude"
