l_polish:
 game_rule_category_DI_interface: "Divine Intervention"
 rule_DI_button_position: "Divine Intervention: pozycja przycisku"
 setting_DI_button_position_sidebar: "Prawa kolumna"
 setting_DI_button_position_sidebar_desc: "Umieszcza przycisk Divine Intervention pod ostatnim widocznym przyciskiem standardowego panelu bocznego."
 setting_DI_button_position_new_column: "Lewa kolumna"
 setting_DI_button_position_new_column_desc: "Umieszcza przycisk Divine Intervention we własnej kolumnie po lewej stronie panelu bocznego. Użyj tej opcji, jeśli inny mod interfejsu zasłania domyślną pozycję."
 DI_button_position_interaction: "#color_yellow #bold (DI)#!#! Pozycja przycisku menu"
 DI_button_position_interaction_desc: "Wybierz kolumnę przycisku menu w swoich ustawieniach DI. Ten wybór ma pierwszeństwo przed zasadą kampanii. Wybierz Użyj zasady gry, aby przywrócić ustawienie domyślne."
 DI_button_position_use_rule: "Użyj zasady gry"
 DI_button_position_apply: "Zastosuj"
 DI_button_position_move_up: "Przesuń o odstęp w górę"
 DI_button_position_move_up_desc: "Przesuwa o jedno miejsce przycisku w górę, pomijając małe odstępy. Zatrzymuje się na górze i zachowuje wybraną kolumnę."
 DI_button_position_move_down: "Przesuń o odstęp w dół"
 DI_button_position_move_down_desc: "Przesuwa o jedno miejsce przycisku w dół, pomijając małe odstępy. Zatrzymuje się w zwykłej dolnej pozycji i zachowuje wybraną kolumnę."
 DI_button_position_move_top: "Przesuń na samą górę"
 DI_button_position_move_top_desc: "Natychmiast usuwa wszystkie odstępy nad przyciskiem, zachowując wybraną kolumnę."
 DI_button_position_move_bottom: "Przesuń na sam dół"
 DI_button_position_move_bottom_desc: "Natychmiast przywraca wszystkie odstępy nad przyciskiem, zachowując wybraną kolumnę."
 DI_button_position_event_desc: "Dostosuj pozycję przycisku menu. Zmiany działają natychmiast, a okno otwiera się ponownie po każdym wyborze. Zamknij je po zakończeniu. Użyj zasady gry przywraca domyślną kolumnę kampanii bez resetowania wysokości."
 DI_button_position_close: "Zamknij"
