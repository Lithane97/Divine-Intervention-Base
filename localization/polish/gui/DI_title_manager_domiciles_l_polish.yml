 DI_dm_counts:0 "Wybrano: [GetPlayer.MakeScope.Var('DI_dm_selected_count').GetValue] / [GetPlayer.MakeScope.Var('DI_dm_candidate_count').GetValue] | Widoczne: [GetPlayer.MakeScope.Var('DI_dm_shown_count').GetValue]"
 DI_dm_filter_all_loc:0 "Wszystkie typy siedzib"
 DI_dm_filter_help:0 "Filtruj listę wczytanych siedzib według typu. Zmiana filtra zachowuje dotychczasowe zaznaczenia, w tym ukryte. Działania obejmują wszystkie wybrane siedziby."
 DI_dm_select_all_tt:0 "Zastąp bieżące zaznaczenie wszystkimi siedzibami widocznymi przy aktywnym filtrze."
 DI_dm_selection_help:0 "Zaznacz siedziby do edycji. Wspólne siedziby są wyświetlane tylko raz."
 DI_dm_upgrade:0 "Ulepsz istniejące budynki"
 DI_dm_upgrade_tt:0 "Natychmiast ulepsz istniejące budynki w wybranych siedzibach. Zatrzymuje się na rozgałęzieniach ulepszeń. Nie dodaje budynków wewnętrznych ani nie zastępuje innych budynków. Pomija siedziby, w których trwa budowa."
 DI_dm_construct_help:0 "Budowa budynków — wybierz typ i poziom"
 DI_dm_construct:0 "Wznieś budynki"
 DI_dm_construction_title:0 "Budowa w siedzibie"
 DI_dm_level_selector:0 "Poziom budynku"
 DI_dm_level_selector_tt:0 "Dotyczy wszystkich przycisków budynków. Maks. wybiera najwyższy poziom. Jeśli ciąg ulepszeń jest krótszy niż wybrany poziom, używany jest najwyższy dostępny poziom."
 DI_dm_level_max:0 "Maks."
 DI_dm_last_action:0 "Ostatnie działanie: [GetPlayer.MakeScope.Var('DI_dm_changed_count').GetValue] zmian budynków"
 DI_dm_construct_tt:0 "Lewy przycisk myszy buduje lub ustawia wybrany poziom, również niższy. Prawy przycisk myszy usuwa budynek bez zwrotu kosztów; główny budynek wraca do poziomu 1. Usunięcie budynku zewnętrznego usuwa jego budynki wewnętrzne. Siedziby z trwającą budową lub niezgodne są pomijane. Dodawanie budynków nadal podlega warunkom budowy określonym przez grę."
 DI_dm_building_actions_tt:0 "Lewy przycisk myszy: ustaw wybrany poziom (budowa, ulepszenie lub obniżenie poziomu).\nPrawy przycisk myszy: usuń ten budynek bez zwrotu kosztów. Usunięcie budynku nadrzędnego usuwa również jego budynki wewnętrzne.\nObniżenie poziomu może zmniejszyć liczbę miejsc na budynki wewnętrzne.\n\n"
 DI_dm_main_building_actions_tt:0 "Lewy przycisk myszy: ustaw wybrany poziom (ulepszenie lub obniżenie poziomu).\nPrawy przycisk myszy: przywróć główny budynek do poziomu 1 bez zwrotu kosztów.\nObniżenie poziomu może zmniejszyć liczbę miejsc na budynki wewnętrzne.\n\n"
 DI_dm_slot_main:0 "Główny budynek"
 DI_dm_slot_external:0 "Budynki zewnętrzne"
 DI_dm_slot_internal:0 "Budynki wewnętrzne"
