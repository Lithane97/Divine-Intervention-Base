l_polish:

 DI_tm_manage_slots: "Manage Slots"
 DI_tm_manage_slots_tt: "Open slot management for the selected provinces."
 DI_tm_slots_help: "Applies to the selected provinces. Left-click adds a slot bonus; right-click removes a DI-added slot bonus. Dedicated district slots have remove-only controls."
 DI_tm_slots_building: "District Building Slots"
 DI_tm_slots_building_tt: "#Bold Left-Click#! to add one district building slot.\n#Bold Right-Click#! to remove a DI-added building-slot bonus. Includes bonuses from the old Add Building Slot button."
 DI_tm_slots_standard: "Standard District Slots"
 DI_tm_slots_standard_tt: "#Bold Left-Click#! to add one Standard District slot.\n#Bold Right-Click#! to remove a DI-added Standard District slot bonus. Districts beyond the available capacity may become inactive."
 DI_tm_slots_special: "Remove Special District Slot"
 DI_tm_slots_special_tt: "Remove the Special District slot, including its district and all buildings in it. Provinces without this slot are skipped."
 DI_tm_slots_great: "Remove Great District Slot"
 DI_tm_slots_great_tt: "Remove the Great District slot, including its district and all buildings in it. Provinces without this slot are skipped."
 DI_tm_slots_entrepot: "Remove Entrepôt District Slot"
 DI_tm_slots_entrepot_tt: "Remove the Entrepôt District slot, including its district and all buildings in it. Provinces without this slot are skipped."
 DI_tm_slots_building_add_modifier: "Added District Building Slots"
 DI_tm_slots_building_remove_modifier: "Retired Adjustment to District Building Slots"
 DI_tm_slots_standard_add_modifier: "Added Standard District Slots"
 DI_tm_slots_standard_remove_modifier: "Retired Adjustment to Standard District Slots"
