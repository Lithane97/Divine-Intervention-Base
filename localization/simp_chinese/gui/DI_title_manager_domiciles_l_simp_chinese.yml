 DI_dm_construction_title:0 "住所建筑"
 DI_dm_level_selector:0 "建筑等级"
 DI_dm_level_selector_tt:0 "适用于所有建筑按钮。“最高”会选择最高等级。如果建筑升级链短于所选等级，则使用该建筑可用的最高等级。"
 DI_dm_level_max:0 "最高"
 DI_dm_last_action:0 "上次操作：[GetPlayer.MakeScope.Var('DI_dm_changed_count').GetValue]次建筑变更"
 DI_dm_construct_tt:0 "左键点击可建造建筑或设为所选等级，也可降低等级。右键点击可移除建筑且不返还资源；主建筑会重置为1级。移除外部建筑也会移除其内部建筑。跳过正在施工或不兼容的住所。添加建筑时仍须满足游戏原有的建造条件。"
 DI_dm_building_actions_tt:0 "左键点击：设为所选等级（建造、升级或降级）。\n右键点击：移除此建筑且不返还资源。移除所属的外部或主建筑也会移除其内部建筑。\n降级可能减少内部建筑槽位容量。\n\n"
 DI_dm_main_building_actions_tt:0 "左键点击：设为所选等级（升级或降级）。\n右键点击：将主建筑重置为1级且不返还资源。\n降级可能减少内部建筑槽位容量。\n\n"
