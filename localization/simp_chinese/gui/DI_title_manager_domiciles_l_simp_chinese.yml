 DI_dm_upgrade:0 "升级现有建筑"
 DI_dm_upgrade_tt:0 "立即升级已选住所中的现有建筑。遇到分支升级路线时停止。不会添加内部建筑或替换其他建筑。跳过正在施工的住所。"
 DI_dm_construct_help:0 "建造建筑——选择类型和等级"
