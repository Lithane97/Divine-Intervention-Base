l_spanish:
 game_rule_category_DI_interface: "Divine Intervention"
 rule_DI_button_position: "Divine Intervention: posición del botón"
 setting_DI_button_position_sidebar: "Columna derecha"
 setting_DI_button_position_sidebar_desc: "Coloca el botón de Divine Intervention debajo del último botón visible de la barra lateral del juego."
 setting_DI_button_position_new_column: "Columna izquierda"
 setting_DI_button_position_new_column_desc: "Coloca el botón de Divine Intervention en su propia columna a la izquierda de la barra lateral. Úsalo si otro mod de interfaz se superpone a la posición predeterminada."
 DI_button_position_interaction: "#color_yellow #bold (DI)#!#! Posición del botón de menú"
 DI_button_position_interaction_desc: "Elige la columna del botón de menú en tus ajustes de DI. Esta opción tiene prioridad sobre la regla de la campaña. Selecciona Usar regla de juego para restaurar la posición predeterminada."
 DI_button_position_use_rule: "Usar regla de juego"
 DI_button_position_apply: "Aplicar"
 DI_button_position_move_up: "Subir un espacio"
 DI_button_position_move_up_desc: "Sube un espacio de botón, omitiendo los separadores pequeños. Se detiene arriba sin cambiar la columna elegida."
 DI_button_position_move_down: "Bajar un espacio"
 DI_button_position_move_down_desc: "Baja un espacio de botón, omitiendo los separadores pequeños. Se detiene en la posición inferior normal sin cambiar la columna elegida."
 DI_button_position_move_top: "Mover arriba del todo"
 DI_button_position_move_top_desc: "Elimina todos los espacios sobre el botón inmediatamente, sin cambiar la columna elegida."
 DI_button_position_move_bottom: "Mover abajo del todo"
 DI_button_position_move_bottom_desc: "Restaura todos los espacios sobre el botón inmediatamente, sin cambiar la columna elegida."
 DI_button_position_event_desc: "Ajusta la posición del botón de menú. Los cambios se aplican inmediatamente y esta ventana se abre de nuevo tras cada elección. Ciérrala al terminar. Usar regla de juego restaura la columna predeterminada sin restablecer la altura."
 DI_button_position_close: "Cerrar"
