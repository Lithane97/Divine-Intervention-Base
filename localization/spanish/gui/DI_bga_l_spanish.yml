l_spanish:
 # Divine Intervention - By God Alone additions
 DI_study_rite_interaction: "#color_yellow #bold (DI)#!#! Estudiar rito"
 DI_study_rite_interaction_desc: "Completa al instante una intriga de Estudiar fe sobre este personaje: aprendes todos los tenets y doctrinas de su rito, descubres el tenet de sincretismo correspondiente y eliges si además te conviertes a él."
 DI_study_rite_interaction_tt: "Abre el evento de éxito de Estudiar fe para el rito de este personaje."
 DI_study_rite_not_playable_tt: "Tienes que ser un gobernante jugable para aprender tenets y doctrinas."
 DI_study_rite_nothing_to_learn_tt: "Ya conoces todo lo que este rito puede enseñarte."
 DI_cardinal_interaction: "#color_yellow #bold (DI)#!#! Cardenalato"
 DI_cardinal_interaction_desc: "Nombra a este personaje miembro del Colegio Cardenalicio o le retira el cardenalato."
 DI_cardinal_option_appoint: "Nombrar cardenal"
 DI_cardinal_option_remove: "Retirar el cardenalato"
 DI_cardinal_already_tt: "Ya tiene un cardenalato."
 DI_cardinal_faith_tt: "Su fe tiene que tener Colegio Cardenalicio."
 DI_cardinal_government_tt: "Tiene que ser clérigo: gobierno teocrático o de orden sagrada, o sin tierras, y no ser antipapa."
 DI_cardinal_pope_tt: "El Papa tiene que encabezar su fe o su rito."
 DI_cardinal_not_cardinal_tt: "No tiene ningún cardenalato."
 DI_cardinal_appoint_tt: "Recibe un cardenalato y pasa a ser un gobernante eclesiástico."
 DI_cardinal_remove_tt: "Pierde su título de cardenal."
 DI_change_government_ecclesiastical: "Eclesiástico"
 DI_ce_stats_fulfillment: "Plenitud espiritual"
 DI_ce_fulfillment_min_tt: "Fija la plenitud espiritual en -100."
 DI_ce_fulfillment_subtract_tt: "Reduce la plenitud espiritual en 1. Mantén Mayús para 5 o Control para 10. Se detiene en -100. Control tiene prioridad.\nNo tiene efecto mientras la Gracia divina esté activa."
 DI_ce_fulfillment_mid_tt: "Fija la plenitud espiritual en 0."
 DI_ce_fulfillment_add_tt: "Aumenta la plenitud espiritual en 1. Mantén Mayús para 5 o Control para 10. Se detiene en 100. Control tiene prioridad."
 DI_ce_fulfillment_max_tt: "Fija la plenitud espiritual en 100."
 DI_ce_grace_fulfillment_button_tt: "#Bold Clic izquierdo#! para conceder la Gracia divina: la plenitud espiritual ya no puede perderse.\n#Bold Clic derecho#! para retirar la Gracia divina.\nBaja el valor antes de concederla, porque también bloquea las reducciones."
 DI_divine_grace: "Gracia divina"
 DI_divine_grace_desc: "Nunca se pierde plenitud espiritual."
 DI_fe_personal_tenets_heading: "Creencias personales"
 DI_fe_personal_tenets_heading_tt: "Creencias personales del personaje seleccionado. Solo las tienen los personajes jugables."
 DI_fe_add_personal_tenet: "Añadir creencia personal"
 DI_fe_add_personal_tenet_tt: "Elige cualquier tenet para añadirlo a las creencias personales del personaje seleccionado. Si no tiene huecos libres, se sustituye el peor para su plenitud espiritual."
 DI_fe_remove_personal_tenet: "Quitar creencia personal"
 DI_fe_remove_personal_tenet_tt: "Elige una de las creencias personales del personaje seleccionado para quitársela."
 DI_fe_personal_add_help: "Haz clic en un tenet para añadirlo como creencia personal. La ventana sigue abierta para que puedas añadir varios."
 DI_fe_personal_remove_help: "Solo aparecen las creencias personales actuales del personaje. Haz clic en una para quitarla."
 DI_bga_study_rite.0001.b: "Este rito, el [target.GetRite.GetNameNoTooltip|l], tiene más sentido para mí que mis propias tradiciones…"
 DI_religion_show_rites_tt: "Muestra los ritos de esta fe."
 DI_religion_faith_main_rite_tt: "Elige esta fe con su rito principal. Despliégala para elegir un rito concreto."
 DI_religion_main_rite: "(rito principal)"
