 DI_dm_filter_all_loc:0 "Todos los tipos de domicilio"
 DI_dm_filter_help:0 "Filtrar por tipo la lista de domicilios cargados. Cambiar el filtro conserva las selecciones existentes, incluidas las ocultas. Las acciones afectan a todos los domicilios seleccionados."
 DI_dm_select_all_tt:0 "Sustituir la selección actual por todos los domicilios mostrados por el filtro activo."
 DI_dm_selection_help:0 "Marca los domicilios que quieras editar. Los domicilios compartidos aparecen una sola vez."
 DI_dm_upgrade:0 "Mejorar edificios existentes"
 DI_dm_upgrade_tt:0 "Mejorar al instante los edificios existentes de los domicilios seleccionados. Se detiene en las bifurcaciones de mejora. No añade edificios interiores ni sustituye otros edificios. Omite los domicilios con construcciones en curso."
 DI_dm_construct_help:0 "Construir edificios - elegir tipo y nivel"
 DI_dm_construct:0 "Construir edificios"
 DI_dm_construction_title:0 "Construcción del domicilio"
 DI_dm_level_selector:0 "Nivel del edificio"
 DI_dm_level_selector_tt:0 "Se aplica a todos los botones de edificio. Máx. selecciona el nivel más alto. Las cadenas más cortas que el nivel seleccionado usan su nivel máximo disponible."
 DI_dm_level_max:0 "Máx."
 DI_dm_last_action:0 "Última acción: [GetPlayer.MakeScope.Var('DI_dm_changed_count').GetValue] cambios en edificios"
 DI_dm_construct_tt:0 "Clic izquierdo para construir o fijar el nivel seleccionado, incluso uno inferior. Clic derecho para eliminar el edificio sin reembolso; el edificio principal vuelve al nivel 1. Eliminar un edificio exterior elimina sus edificios interiores. Se omiten los domicilios con construcciones en curso o incompatibles. Los requisitos de construcción del juego siguen aplicándose al añadir edificios."
 DI_dm_building_actions_tt:0 "Clic izquierdo: fijar el nivel seleccionado (construir, mejorar o reducir nivel).\nClic derecho: eliminar este edificio sin reembolso. Eliminar un edificio principal del que dependen otros también elimina sus edificios interiores.\nReducir el nivel puede disminuir la capacidad de espacios interiores.\n\n"
 DI_dm_main_building_actions_tt:0 "Clic izquierdo: fijar el nivel seleccionado (mejorar o reducir nivel).\nClic derecho: restablecer el edificio principal al nivel 1 sin reembolso.\nReducir el nivel puede disminuir la capacidad de espacios interiores.\n\n"
 DI_dm_slot_main:0 "Edificio principal"
