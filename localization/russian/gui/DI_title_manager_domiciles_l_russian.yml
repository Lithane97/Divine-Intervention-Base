 DI_dm_tab:0 "Резиденции"
 DI_dm_load_pinned:0 "Загрузить закреплённых персонажей"
 DI_dm_load_self:0 "Мои резиденции"
 DI_dm_refresh:0 "Обновить"
 DI_dm_select_all:0 "Выбрать всё"
 DI_dm_clear:0 "Снять выделение"
 DI_dm_counts:0 "Выбрано: [GetPlayer.MakeScope.Var('DI_dm_selected_count').GetValue] / [GetPlayer.MakeScope.Var('DI_dm_candidate_count').GetValue] | Показано: [GetPlayer.MakeScope.Var('DI_dm_shown_count').GetValue]"
 DI_dm_filter_all_loc:0 "Все типы резиденций"
 DI_dm_filter_help:0 "Фильтровать загруженные резиденции по типу. При смене фильтра сохраняется текущий выбор, включая скрытые резиденции. Действия применяются ко всем выбранным резиденциям."
 DI_dm_select_all_tt:0 "Заменить текущий выбор всеми резиденциями, отображаемыми активным фильтром."
 DI_dm_selection_help:0 "Отметьте резиденции для изменения. Общие резиденции отображаются только один раз."
 DI_dm_upgrade:0 "Улучшить существующие здания"
 DI_dm_upgrade_tt:0 "Мгновенно улучшить существующие здания в выбранных резиденциях. Останавливается на разветвлениях улучшений. Не добавляет внутренние здания и не заменяет другие здания. Пропускает резиденции, где ведётся строительство."
 DI_dm_construct_help:0 "Строительство зданий — выбрать тип и уровень"
 DI_dm_construct:0 "Построить здания"
 DI_dm_construction_title:0 "Строительство в резиденции"
 DI_dm_level_selector:0 "Уровень здания"
 DI_dm_level_selector_tt:0 "Применяется ко всем кнопкам зданий. Макс. выбирает наивысший уровень. Если цепочка короче выбранного уровня, используется её наивысший доступный уровень."
 DI_dm_level_max:0 "Макс."
 DI_dm_last_action:0 "Последнее действие: [GetPlayer.MakeScope.Var('DI_dm_changed_count').GetValue] изменений зданий"
 DI_dm_construct_tt:0 "Левая кнопка мыши: построить здание или установить выбранный уровень, в том числе более низкий. Правая кнопка мыши: удалить здание без возврата средств; главное здание возвращается на уровень 1. При удалении внешнего здания удаляются его внутренние здания. Резиденции, где ведётся строительство, и несовместимые резиденции пропускаются. При добавлении зданий действуют требования строительства самой игры."
 DI_dm_building_actions_tt:0 "Левая кнопка мыши: установить выбранный уровень (построить, улучшить или понизить).\nПравая кнопка мыши: удалить здание без возврата средств. При удалении родительского здания также удаляются его внутренние здания.\nПонижение уровня может уменьшить число внутренних строительных ячеек.\n\n"
 DI_dm_main_building_actions_tt:0 "Левая кнопка мыши: установить выбранный уровень (улучшить или понизить).\nПравая кнопка мыши: вернуть главное здание на уровень 1 без возврата средств.\nПонижение уровня может уменьшить число внутренних строительных ячеек.\n\n"
 DI_dm_slot_main:0 "Главное здание"
 DI_dm_slot_external:0 "Внешние здания"
 DI_dm_slot_internal:0 "Внутренние здания"
