l_russian:
 game_rule_category_DI_interface: "Divine Intervention"
 rule_DI_button_position: "Divine Intervention: положение кнопки"
 setting_DI_button_position_sidebar: "Правый столбец"
 setting_DI_button_position_sidebar_desc: "Размещает кнопку Divine Intervention под последней видимой кнопкой стандартной боковой панели."
 setting_DI_button_position_new_column: "Левый столбец"
 setting_DI_button_position_new_column_desc: "Размещает кнопку Divine Intervention в отдельном столбце слева от боковой панели. Используйте, если другой мод интерфейса перекрывает стандартное положение."
 DI_button_position_interaction: "#color_yellow #bold (DI)#!#! Положение кнопки меню"
 DI_button_position_interaction_desc: "Выберите столбец кнопки меню в своих настройках DI. Эта настройка имеет приоритет над правилом кампании. Выберите Использовать правило игры, чтобы вернуть исходное положение."
 DI_button_position_use_rule: "Использовать правило игры"
 DI_button_position_apply: "Применить"
 DI_button_position_move_up: "Поднять на один интервал"
 DI_button_position_move_up_desc: "Поднимает на одно место кнопки, пропуская малые интервалы. Останавливается наверху, сохраняя выбранный столбец."
 DI_button_position_move_down: "Опустить на один интервал"
 DI_button_position_move_down_desc: "Опускает на одно место кнопки, пропуская малые интервалы. Останавливается в обычном нижнем положении, сохраняя выбранный столбец."
 DI_button_position_move_top: "Переместить наверх"
 DI_button_position_move_top_desc: "Сразу убирает все интервалы над кнопкой, сохраняя выбранный столбец."
 DI_button_position_move_bottom: "Переместить вниз"
 DI_button_position_move_bottom_desc: "Сразу восстанавливает все интервалы над кнопкой, сохраняя выбранный столбец."
 DI_button_position_event_desc: "Настройте положение кнопки меню. Изменения применяются сразу, а окно открывается снова после каждого выбора. Закройте его, когда закончите. Использовать правило игры восстанавливает столбец кампании по умолчанию, не сбрасывая высоту."
 DI_button_position_close: "Закрыть"
