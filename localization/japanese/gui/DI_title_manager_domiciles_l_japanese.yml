 DI_dm_select_all:0 "すべて選択"
 DI_dm_clear:0 "選択を解除"
 DI_dm_counts:0 "選択中：[GetPlayer.MakeScope.Var('DI_dm_selected_count').GetValue] / [GetPlayer.MakeScope.Var('DI_dm_candidate_count').GetValue] | 表示中：[GetPlayer.MakeScope.Var('DI_dm_shown_count').GetValue]"
 DI_dm_filter_all_loc:0 "すべての住居の種類"
 DI_dm_filter_help:0 "読み込んだ住居の一覧を種類で絞り込みます。フィルターを変更しても、非表示の住居を含め、現在の選択は維持されます。操作は選択中のすべての住居に適用されます。"
 DI_dm_select_all_tt:0 "現在の選択を、適用中のフィルターに表示されるすべての住居に置き換えます。"
 DI_dm_selection_help:0 "編集する住居にチェックを入れてください。共有の住居は一度だけ表示されます。"
 DI_dm_upgrade:0 "既存の建造物をアップグレード"
 DI_dm_upgrade_tt:0 "選択した住居の既存の建造物を即座にアップグレードします。強化先が分岐する場合は停止します。内部建造物の追加や、ほかの建造物の置き換えは行いません。建設中の住居はスキップします。"
 DI_dm_construct_help:0 "建造物の建設 - 種類とレベルを選択"
 DI_dm_construct:0 "建造物を建設"
 DI_dm_construction_title:0 "住居の建設"
 DI_dm_level_selector:0 "建造物のレベル"
 DI_dm_level_selector_tt:0 "すべての建造物ボタンに適用されます。最大を選ぶと最高レベルを使用します。選択したレベルより建造物の強化段階が少ない場合は、利用可能な最高レベルを使用します。"
 DI_dm_level_max:0 "最大"
 DI_dm_last_action:0 "前回の操作：建造物の変更 [GetPlayer.MakeScope.Var('DI_dm_changed_count').GetValue]件"
 DI_dm_construct_tt:0 "左クリックで建設、または選択したレベルへの設定を行います。レベルを下げることもできます。右クリックで払い戻しなしに建造物を撤去します。主要建造物はレベル1に戻ります。外部建造物を撤去すると、その内部建造物も撤去されます。建設中または非対応の住居はスキップします。建造物の追加にはゲーム本来の建設条件が適用されます。"
 DI_dm_building_actions_tt:0 "左クリック：選択したレベルに設定します（建設、アップグレード、ダウングレード）。\n右クリック：払い戻しなしにこの建造物を撤去します。親となる建造物を撤去すると、その内部建造物も撤去されます。\nレベルを下げると、内部建造物のスロット数が減る場合があります。\n\n"
 DI_dm_main_building_actions_tt:0 "左クリック：選択したレベルに設定します（アップグレード、ダウングレード）。\n右クリック：払い戻しなしに主要建造物をレベル1に戻します。\nレベルを下げると、内部建造物のスロット数が減る場合があります。\n\n"
 DI_dm_slot_main:0 "主要建造物"
