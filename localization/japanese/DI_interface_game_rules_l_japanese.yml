l_japanese:
 game_rule_category_DI_interface: "Divine Intervention"
 rule_DI_button_position: "Divine Intervention：ボタンの位置"
 setting_DI_button_position_sidebar: "右の列"
 setting_DI_button_position_sidebar_desc: "Divine Interventionのボタンを、標準サイドバーの最後に表示されるボタンの下に配置します。"
 setting_DI_button_position_new_column: "左の列"
 setting_DI_button_position_new_column_desc: "Divine Interventionのボタンを、サイドバー左側の独立した列に配置します。他のUI Modが標準位置と重なる場合に使用してください。"
 DI_button_position_interaction: "#color_yellow #bold (DI)#!#! メニューボタンの位置"
 DI_button_position_interaction_desc: "DI設定のメニューボタンの列を選択します。この設定はキャンペーンのゲームルールより優先されます。ゲームルールを使用を選ぶと既定の位置に戻ります。"
 DI_button_position_use_rule: "ゲームルールを使用"
 DI_button_position_apply: "適用"
 DI_button_position_move_up: "一段上に移動"
 DI_button_position_move_up_desc: "小さな区切りの間隔を飛ばし、ボタン一つ分上に移動します。最上部で停止し、選択した列は維持されます。"
 DI_button_position_move_down: "一段下に移動"
 DI_button_position_move_down_desc: "小さな区切りの間隔を飛ばし、ボタン一つ分下に移動します。通常の最下部で停止し、選択した列は維持されます。"
 DI_button_position_move_top: "最上部に移動"
 DI_button_position_move_top_desc: "ボタンの上のすべての間隔を即座に取り除きます。選択した列は維持されます。"
 DI_button_position_move_bottom: "最下部に移動"
 DI_button_position_move_bottom_desc: "ボタンの上のすべての間隔を即座に戻します。選択した列は維持されます。"
 DI_button_position_event_desc: "メニューボタンの位置を調整します。変更は即座に適用され、選択するたびにこのウィンドウが再び開くので続けて調整できます。完了したら閉じてください。ゲームルールを使用は、高さをリセットせずにキャンペーン既定の列を復元します。"
 DI_button_position_close: "閉じる"
