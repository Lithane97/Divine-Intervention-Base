l_french:
 game_rule_category_DI_interface: "Divine Intervention"
 rule_DI_button_position: "Divine Intervention : position du bouton"
 setting_DI_button_position_sidebar: "Colonne de droite"
 setting_DI_button_position_sidebar_desc: "Place le bouton Divine Intervention sous le dernier bouton visible de la barre latérale du jeu de base."
 setting_DI_button_position_new_column: "Colonne de gauche"
 setting_DI_button_position_new_column_desc: "Place le bouton Divine Intervention dans sa propre colonne, à gauche de la barre latérale. À utiliser si un autre mod d'interface chevauche la position par défaut."
 DI_button_position_interaction: "#color_yellow #bold (DI)#!#! Position du bouton du menu"
 DI_button_position_interaction_desc: "Choisissez la colonne du bouton du menu pour vos paramètres DI. Ce choix remplace la règle de jeu de la partie. Sélectionnez Utiliser la règle de jeu pour rétablir la valeur par défaut de la partie."
 DI_button_position_use_rule: "Utiliser la règle de jeu"
 DI_button_position_apply: "Appliquer"
 DI_button_position_move_up: "Monter d'un cran"
 DI_button_position_move_up_desc: "Monte d'un emplacement de la taille d'un bouton, en ignorant les petits séparateurs. S'arrête en haut et conserve votre choix de colonne."
 DI_button_position_move_down: "Descendre d'un cran"
 DI_button_position_move_down_desc: "Descend d'un emplacement de la taille d'un bouton, en ignorant les petits séparateurs. S'arrête à la position basse normale et conserve votre choix de colonne."
 DI_button_position_move_top: "Placer en haut"
 DI_button_position_move_top_desc: "Retire immédiatement tous les crans au-dessus du bouton. Conserve votre choix de colonne."
 DI_button_position_move_bottom: "Placer en bas"
 DI_button_position_move_bottom_desc: "Rétablit immédiatement tous les crans au-dessus du bouton. Conserve votre choix de colonne."
 DI_button_position_event_desc: "Ajustez la position du bouton du menu. Les modifications s'appliquent immédiatement, et cette fenêtre se rouvre après chaque choix pour vous permettre de continuer à l'ajuster. Fermez-la une fois terminé. Utiliser la règle de jeu rétablit la colonne par défaut de la partie sans réinitialiser la hauteur."
 DI_button_position_close: "Fermer"
