l_french:
 game_rule_category_DI_interface: "Divine Intervention"
 rule_DI_button_position: "Divine Intervention : position du bouton"
 setting_DI_button_position_sidebar: "Colonne de droite"
 setting_DI_button_position_sidebar_desc: "Place le bouton Divine Intervention sous le dernier bouton visible de la barre latérale du jeu."
 setting_DI_button_position_new_column: "Colonne de gauche"
 setting_DI_button_position_new_column_desc: "Place le bouton Divine Intervention dans sa propre colonne à gauche de la barre latérale. À utiliser si un autre mod d’interface chevauche la position par défaut."
 DI_button_position_interaction: "#color_yellow #bold (DI)#!#! Position du bouton de menu"
 DI_button_position_interaction_desc: "Choisissez la colonne du bouton de menu dans vos réglages DI. Ce choix remplace la règle de la campagne. Choisissez Utiliser la règle du jeu pour rétablir le réglage par défaut."
 DI_button_position_use_rule: "Utiliser la règle du jeu"
 DI_button_position_apply: "Appliquer"
 DI_button_position_move_up: "Monter d’un espace"
 DI_button_position_move_up_desc: "Monte d’un emplacement de bouton en sautant les petits séparateurs. S’arrête en haut sans changer la colonne choisie."
 DI_button_position_move_down: "Descendre d’un espace"
 DI_button_position_move_down_desc: "Descend d’un emplacement de bouton en sautant les petits séparateurs. S’arrête en bas sans changer la colonne choisie."
 DI_button_position_move_top: "Déplacer tout en haut"
 DI_button_position_move_top_desc: "Retire immédiatement tous les espaces au-dessus du bouton, sans changer la colonne choisie."
 DI_button_position_move_bottom: "Déplacer tout en bas"
 DI_button_position_move_bottom_desc: "Rétablit immédiatement tous les espaces au-dessus du bouton, sans changer la colonne choisie."
 DI_button_position_event_desc: "Ajustez la position du bouton de menu. Les changements sont immédiats et cette fenêtre se rouvre après chaque choix. Fermez-la une fois terminé. Utiliser la règle du jeu rétablit la colonne par défaut sans modifier la hauteur."
 DI_button_position_close: "Fermer"
