### Main Window ###
DI_button_tt: "Menu Divine Intervention"
DI_VIEW_TITLE: "Menu de triche Divine Intervention"
DI_loading: "Chargement de la fenêtre..."
# buttons
DI_char_editor_tt: "Ouvre un menu permettant de modifier divers aspects de tous les personnages épinglés. Cela inclut le présent menu."
DI_pinned_characters_tt: "Ouvre un menu permettant d'ajouter et de retirer des ressources, de voir les personnages épinglés, et plus encore."
DI_char_spawner_tt: "Ouvre un menu permettant de choisir dans une liste les personnages à faire apparaître."
DI_army_spawner_tt: "Ouvre un menu permettant de choisir dans plusieurs listes les hommes d'armes à faire apparaître, ainsi que leur nombre."
DI_diplomacy_tt: "Ouvre une fenêtre permettant de gérer les actions diplomatiques des personnages épinglés."
DI_artifact_creator_tt: "Ouvre un menu permettant de voir la liste des artefacts des personnages épinglés, de créer des artefacts et d'appliquer divers effets aux artefacts listés."
DI_cultural_editor_window: "Éditeur culturel" # button label
DI_cultural_editor_window_tt: "Ouvre un menu permettant de modifier la culture des personnages épinglés."
DI_faith_editor_window: "Éditeur de foi" # button label
DI_faith_editor_window_tt: "Ouvre un menu permettant de modifier la religion des personnages épinglés."
DI_debug_mode: "Mode débogage"
DI_debug_mode_tt: "Active/désactive le mode débogage. Désactive les succès.\n#N Attention : activer le mode débogage pendant que le jeu tourne peut provoquer des plantages ou de l'instabilité. Il est recommandé de lancer plutôt le jeu avec l'option de ligne de commande -debug_mode.#!"
DI_clear_pins: "Retirer tous les épinglages"
DI_clear_pins_tt: "Clic gauche pour retirer tous les épinglages"
DI_test_button: "Fenêtre de test"
DI_test_button_tt: "Ouvre la fenêtre de test."
### Character Editor ###
DI_char_editor: "Éditeur de personnage" # window title / button label
DI_tab_presents: "Cadeaux" # category button label
DI_tab_skills: "Aptitudes" # category button label
DI_tab_perk_points: "Points d'atout" # category button label
DI_tab_modifiers: "Modificateurs" # category button label
DI_tab_traits: "Traits" # category button label
DI_tab_sexuality: "Orientation sexuelle" # category button label
DI_tab_culture: "Culture" # category button label
DI_tab_religion: "Religion" # category button label
# categories in character editor
DI_present_char_editor: "Cadeaux" # category button label
DI_present_char_editor_TT: "Un menu permettant de choisir parmi diverses catégories de « cadeaux » qui aideront ou pénaliseront rapidement le personnage épinglé."
DI_skill_char_editor: "Aptitudes" # category button label
DI_skill_char_editor_TT: "Un menu permettant de modifier les aptitudes des personnages épinglés."
DI_perk_point_char_editor: "Points d'atout"
DI_modifiers_char_editor: "Modificateurs"
DI_modifiers_char_editor_TT: "Un menu permettant d'ajouter aux personnages épinglés ou de leur retirer la plupart des modificateurs du jeu."
DI_traits_char_editor: "Traits"
DI_traits_char_editor_TT: "Un menu permettant d'ajouter aux personnages épinglés ou de leur retirer la plupart des traits du jeu."
DI_clear_all_traits: "Retirer tous les traits"
DI_sexuality_char_editor: "Orientation sexuelle"
DI_sexuality_char_editor_TT: "Un menu permettant de choisir l'orientation sexuelle des personnages épinglés."
DI_culture_group_char_editor: "Culture"
DI_culture_group_char_editor_TT: "Un menu permettant de choisir une culture vers laquelle convertir les personnages épinglés."
DI_religion_group_char_editor: "Religion"
DI_religion_group_char_editor_TT: "Un menu permettant de choisir une religion vers laquelle convertir les personnages épinglés."
