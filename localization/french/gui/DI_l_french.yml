DI_skill_intrigue_tt: "#P Clic gauche :#! Ajouter #P [GetPlayer.MakeScope.Var('DI_intrigue_value').GetValue|0] #!en [intrigue|E] \n#N Clic droit :#! Retirer #N [GetPlayer.MakeScope.Var('DI_intrigue_value').GetValue|0]#! en [intrigue|E]"
DI_skill_learning_tt: "#P Clic gauche :#! Ajouter #P [GetPlayer.MakeScope.Var('DI_learning_value').GetValue|0] #!en [learning|E] \n#N Clic droit :#! Retirer #N [GetPlayer.MakeScope.Var('DI_learning_value').GetValue|0]#! en [learning|E]"
DI_skill_prowess_tt: "#P Clic gauche :#! Ajouter #P [GetPlayer.MakeScope.Var('DI_prowess_value').GetValue|0] #!en [prowess|E] \n#N Clic droit :#! Retirer #N [GetPlayer.MakeScope.Var('DI_prowess_value').GetValue|0]#! en [prowess|E]"
