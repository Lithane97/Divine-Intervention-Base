# health category
DI_ce_eliminate_health_issues_button: "Éliminer les problèmes de santé" # button label
DI_ce_eliminate_health_issues_button_tt: "#Bold Clic gauche#! pour éliminer tous les problèmes de santé."
DI_ce_good_genes_button: "Bons gènes" # button label
DI_ce_good_genes_button_tt: "#Bold Clic gauche#! pour ajouter de bons gènes.\n#Bold Clic droit#! pour retirer les bons gènes."
DI_ce_bad_genes_button: "Mauvais gènes" # button label
DI_ce_bad_genes_button_tt: "#Bold Clic gauche#! pour ajouter de mauvais gènes.\n#Bold Clic droit#! pour retirer les mauvais gènes."
DI_ce_lock_stress_button: "Verrouiller le niveau de stress" # button label
DI_ce_lock_stress_button_tt: "#Bold Clic gauche#! pour verrouiller le niveau de stress.\n#Bold Clic droit#! pour déverrouiller le niveau de stress."
DI_ce_lock_tyranny_button: "Verrouiller le niveau de tyrannie" # button label
DI_ce_lock_tyranny_button_tt: "#Bold Clic gauche#! pour verrouiller le niveau de tyrannie.\n#Bold Clic droit#! pour déverrouiller le niveau de tyrannie."
DI_ce_lock_dread_button: "Verrouiller le niveau de redoutabilité" # button label
DI_ce_lock_dread_button_tt: "#Bold Clic gauche#! pour verrouiller le niveau de redoutabilité.\n#Bold Clic droit#! pour déverrouiller le niveau de redoutabilité."
DI_present_health_eliminate_issues: "Éliminer les problèmes de santé"
DI_present_health_eliminate_issues_TT: "Retire les problèmes de santé néfastes."
DI_present_health_good_genes: "Bons gènes"
DI_present_health_good_genes_TT: "Retire les mauvais gènes de santé et ajoute les meilleurs gènes.\n#F Clic gauche pour ajouter, clic droit pour retirer#!"
DI_present_health_bad_genes: "Mauvais gènes"
DI_present_health_bad_genes_TT: "Retire les bons gènes de santé et ajoute les pires gènes.\n#F Clic gauche pour ajouter, clic droit pour retirer#!"
DI_present_health_no_stress_change: "Verrouiller le niveau de stress"
DI_present_health_no_stress_change_TT: "Un modificateur qui bloque le niveau de stress à sa valeur actuelle.\n#F Clic gauche pour ajouter, clic droit pour retirer#!"
DI_present_health_no_tyranny_change: "Verrouiller le niveau de tyrannie"
DI_present_health_no_tyranny_change_TT: "Un modificateur qui bloque le niveau de tyrannie à sa valeur actuelle.\n#F Clic gauche pour ajouter, clic droit pour retirer#!"
DI_present_health_no_dread_change: "Verrouiller le niveau de redoutabilité"
DI_present_health_no_dread_change_TT: "Un modificateur qui bloque le niveau de redoutabilité à sa valeur actuelle.\n#F Clic gauche pour ajouter, clic droit pour retirer#!"
# traits category
DI_ce_randomize_personality_button: "Personnalité aléatoire" # button label
DI_ce_randomize_personality_button_tt: "#Bold Clic gauche#! pour tirer au hasard les traits de personnalité.\n#Bold Clic droit#! pour retirer les traits de personnalité."
DI_ce_special_traits_button: "Traits spéciaux du mod" # button label
DI_ce_special_traits_button_tt: "#Bold Clic gauche#! pour ajouter tous les traits spéciaux ajoutés par ce mod.\n#Bold Clic droit#! pour retirer tous les traits spéciaux ajoutés par ce mod."
DI_ce_commander_traits_button: "Traits de commandant" # button label
DI_ce_commander_traits_button_tt: "#Bold Clic gauche#! pour ajouter tous les traits de commandant.\n#Bold Clic droit#! pour retirer tous les traits de commandant."
# education traits
DI_ce_education_traits_button: "Tous les traits d'éducation" # button label
DI_ce_education_traits_button_tt: "#Bold Clic gauche#! pour donner tous les traits d'éducation.\n#Bold Clic droit#! pour retirer tous les traits d'éducation."
DI_ce_boost_education_button: "Améliorer l'éducation" # button label
DI_ce_boost_education_button_tt: "#Bold Clic gauche#! pour améliorer l'éducation principale.\n#Bold Clic droit#! pour ajouter des traits d'éducation secondaires."
DI_ce_aggressive_traits_button: "Personnalité agressive" # button label
DI_ce_aggressive_traits_button_tt: "#Bold Clic gauche#! pour donner des traits de personnalité agressifs.\n#Bold Clic droit#! pour retirer les traits de personnalité agressifs."
DI_ce_timid_traits_button: "Personnalité timide" # button label
DI_ce_timid_traits_button_tt: "#Bold Clic gauche#! pour donner des traits de personnalité timides.\n#Bold Clic droit#! pour retirer les traits de personnalité timides."
DI_ce_correct_personality_button: "Corriger la personnalité" # button label
DI_ce_correct_personality_button_tt: "#Bold Clic gauche#! Tente de remplacer les traits de personnalité par ceux que la plupart des religions jugent vertueux. \n Gourmand -> Tempéré \n Cupide -> Généreux \n Colérique -> Calme \n Impatient -> Patient \n Arrogant -> Humble \n Lâche -> Brave \n Partial -> Juste \n Lubrique -> Chaste \n Fourbe -> Honnête \n Sans cœur -> Compatissant \n Sadique -> Compatissant \n Vindicatif -> Indulgent \n Paresseux -> Appliqué "
DI_ce_giant_traits_button: "Faire un géant" # button label
DI_ce_giant_traits_button_tt: "#Bold Clic gauche#! pour ajouter les traits qui font des personnages des géants.\n#Bold Clic droit#! pour retirer les traits qui font des personnages des géants."
DI_ce_dwarf_traits_button: "Faire un nain" # button label
DI_ce_dwarf_traits_button_tt: "#Bold Clic gauche#! pour ajouter les traits qui font des personnages des nains.\n#Bold Clic droit#! pour retirer les traits qui font des personnages des nains."
DI_ce_albino_traits_button: "Apparence spectrale" # button label
DI_ce_albino_traits_button_tt: "#Bold Clic gauche#! pour ajouter les traits qui donnent aux personnages une apparence spectrale.\n#Bold Clic droit#! pour retirer les traits qui donnent aux personnages une apparence spectrale."
DI_present_traits_randomize: "Personnalité aléatoire"
DI_present_traits_randomize_TT: "Remplace les traits de personnalité actuels par trois traits choisis au hasard."
DI_present_traits_special: "Traits spéciaux du mod"
DI_present_traits_special_TT: "Ajoute ou retire tous les traits spéciaux ajoutés par ce mod.\n#F Clic gauche pour ajouter, clic droit pour retirer#!"
DI_present_traits_commander: "Traits de commandant"
DI_present_traits_commander_TT: "Ajoute ou retire tous les traits de commandant.\n#F Clic gauche pour ajouter, clic droit pour retirer#!"
DI_present_traits_giant: "Faire un géant"
DI_present_traits_giant_TT: "Ajoute ou retire les traits qui font des personnages des géants.\n#F Clic gauche pour ajouter, clic droit pour retirer#!"
DI_present_traits_midget: "Faire un nain"
DI_present_traits_midget_TT: "Ajoute ou retire les traits qui font des personnages des nains.\n#F Clic gauche pour ajouter, clic droit pour retirer#!"
DI_present_traits_ghostly: "Apparence spectrale"
DI_present_traits_ghostly_TT: "Ajoute ou retire les traits qui donnent aux personnages une apparence spectrale.\n#F Clic gauche pour ajouter, clic droit pour retirer#!"
# laws category
DI_ce_gender_equality_button: "Égalité des sexes" # button label
DI_ce_gender_equality_button_tt: "#Bold Clic gauche#! pour instaurer l'égalité des sexes dans la doctrine de la foi, ouvrir le clergé aux deux sexes, traiter l'adultère de la même façon pour les deux sexes (réprouvé ou accepté), et rendre égalitaires la loi du pays et la coutume martiale de la culture."
DI_ce_inverse_genders_button: "Inverser les normes de genre" # button label
DI_ce_inverse_genders_button_tt: "#Bold Clic gauche#! pour inverser les doctrines de genre de la foi, le sexe du clergé et les doctrines sur l'adultère selon le sexe, inverser les lois de genre du pays avec risque de destitution, destituer le chef religieux du sexe opposé et inverser le sexe de la coutume martiale de la culture."
DI_ce_female_dominated_button: "Domination féminine" # button label
DI_ce_female_dominated_button_tt: "#Bold Clic gauche#! pour instaurer une doctrine de foi à domination féminine, un clergé exclusivement féminin, l'adultère féminin accepté, l'adultère masculin réprouvé ou criminel, une loi du pays réservée aux femmes et une coutume martiale réservée aux femmes."
DI_ce_male_dominated_button: "Domination masculine" # button label
DI_ce_male_dominated_button_tt: "#Bold Clic gauche#! pour instaurer une doctrine de foi à domination masculine, un clergé exclusivement masculin, l'adultère masculin accepté, l'adultère féminin réprouvé ou criminel, une loi du pays réservée aux hommes et une coutume martiale réservée aux hommes."
DI_ce_temporal_hof_button: "Chef temporel de la foi" # button label
DI_ce_temporal_hof_button_tt: "#Bold Clic gauche#! pour faire du joueur le chef temporel de sa foi."
DI_present_laws_gender_equality: "Égalité des sexes"
DI_present_laws_gender_equality_TT: "Égalité des sexes dans la doctrine de la foi, clergé ouvert aux deux sexes, adultère traité de la même façon pour les deux sexes (réprouvé ou accepté), loi du pays et coutume martiale de la culture égalitaires."
DI_present_laws_gender_inverse: "Inverser les genres"
DI_present_laws_gender_inverse_TT: "Inverse les doctrines de genre de la foi, le sexe du clergé et les doctrines sur l'adultère selon le sexe, inverse les lois de genre du pays avec risque de destitution, destitue le chef religieux du sexe opposé et inverse le sexe de la coutume martiale de la culture."
DI_present_laws_gender_female_dominated: "Domination féminine"
DI_present_laws_gender_female_dominated_TT: "Doctrine de foi à domination féminine, clergé exclusivement féminin, adultère féminin accepté, adultère masculin réprouvé ou criminel, loi du pays réservée aux femmes, coutume martiale réservée aux femmes."
DI_present_laws_gender_male_dominated: "Domination masculine"
DI_present_laws_gender_male_dominated_TT: "Doctrine de foi à domination masculine, clergé exclusivement masculin, adultère masculin accepté, adultère féminin réprouvé ou criminel, loi du pays réservée aux hommes, coutume martiale réservée aux hommes."
### Character Editor Skills ###
### Character Editor Titles and Crown Authority ###
DI_ce_tab_titles: "Titres"
DI_ce_tab_crown_authority: "Autorité de la Couronne"
DI_ce_take_realm_titles_button: "Prendre tous les titres du pays"
DI_ce_take_realm_titles_button_tt: "Regroupe chez chaque personnage modifié tous les titres de rang comtal ou supérieur du pays de son souverain. Si la modification des épinglés est désactivée, le personnage modifié est le joueur. Les titres de famille noble et les titres sans terre sont exclus."
DI_ce_take_sub_realm_titles_button: "Prendre tous les titres du sous-pays"
DI_ce_take_sub_realm_titles_button_tt: "Regroupe chez chaque personnage modifié tous les titres de rang comtal ou supérieur qu'il détient ou que détient quiconque se trouve sous lui. Si la modification des épinglés est désactivée, le personnage modifié est le joueur."
DI_ce_take_vassal_titles_button: "Prendre tous les titres des vassaux"
DI_ce_take_vassal_titles_button_tt: "Regroupe chez chaque personnage modifié tous les titres de rang comtal ou supérieur détenus par les vassaux qui se trouvent sous lui. Les titres personnels du personnage modifié sont exclus."
DI_ce_take_personal_titles_button: "Prendre les titres personnels"
DI_ce_take_personal_titles_button_tt: "Transfère au joueur tous les titres de rang comtal ou supérieur détenus personnellement par les personnages épinglés. Utilise toujours les personnages épinglés, quelle que soit la case de modification des épinglés."
DI_ce_take_primary_title_button: "Prendre le titre principal"
DI_ce_take_primary_title_button_tt: "Transfère au joueur le titre principal de chaque personnage épinglé. Utilise toujours les personnages épinglés, quelle que soit la case de modification des épinglés."
DI_ce_crown_authority_1_button: "Autorité de la Couronne 1 — Autonomes"
DI_ce_crown_authority_1_button_tt: "Place chaque dirigeant modifié éligible au niveau 1 d'autorité de la Couronne (Vassaux autonomes)."
DI_ce_crown_authority_2_button: "Autorité de la Couronne 2 — Limitée"
DI_ce_crown_authority_2_button_tt: "Place chaque dirigeant modifié éligible au niveau 2 d'autorité de la Couronne (Autorité de la Couronne limitée)."
DI_ce_crown_authority_3_button: "Autorité de la Couronne 3 — Élevée"
DI_ce_crown_authority_3_button_tt: "Place chaque dirigeant modifié éligible au niveau 3 d'autorité de la Couronne (Autorité de la Couronne élevée)."
DI_ce_crown_authority_4_button: "Autorité de la Couronne 4 — Absolue"
DI_ce_crown_authority_4_button_tt: "Place chaque dirigeant modifié éligible au niveau 4 d'autorité de la Couronne (Autorité de la Couronne absolue). Les dirigeants qui n'utilisent pas l'autorité de la Couronne sont ignorés."

DI_skills: "Aptitudes" # window title
DI_skill_diplomacy_tt: "#P Clic gauche :#! Ajouter #P [GetPlayer.MakeScope.Var('DI_diplomacy_value').GetValue|0] #!en [diplomacy|E] \n#N Clic droit :#! Retirer #N [GetPlayer.MakeScope.Var('DI_diplomacy_value').GetValue|0]#! en [diplomacy|E]"
