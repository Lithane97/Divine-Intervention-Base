l_french:
 DI_ce_stats_tab: "Statistiques"
 DI_ce_stats_player: "Sélectionner le joueur"
 DI_ce_stats_back: "Retour"
 DI_ce_stats_empty: "Épinglez des personnages pour pouvoir les sélectionner ici."
 DI_ce_stats_target: "Modification : [Character.GetShortUINameNoTooltip]"
 DI_ce_stats_target_tt: "Choisissez un personnage dans votre liste d'épinglés, ou Tous pour agir sur tous les personnages épinglés."
 DI_ce_stats_dead: "Ce personnage est mort. Sélectionnez un autre personnage."
 DI_ce_stats_dread: "Redoutabilité"
 DI_ce_stats_tyranny: "Tyrannie"
 DI_ce_stats_visual_age: "Âge visuel des immortels"
 DI_ce_stats_immortal_only: "L'âge visuel ne peut être modifié que pour les personnages immortels."
 DI_ce_stats_na: "—"
 DI_health_cleanup: "Nettoyage permanent de la santé"
 DI_health_cleanup_desc: "Une fois par an, retire les mêmes traits de santé négatifs, modificateurs et indicateurs que Santé permanente. N'accorde aucun bonus de santé."
 DI_rapid_levy_reinforcement: "Renforcement rapide des levées"
 DI_rapid_levy_reinforcement_desc: "Augmente fortement le taux de renforcement des levées."
 DI_ce_dread_min_tt: "Fixer la redoutabilité à 0."
 DI_ce_dread_subtract_tt: "Réduire la redoutabilité de 1. Maintenez Maj pour 5 ou Ctrl pour 10. Ctrl l'emporte si les deux touches sont maintenues."
 DI_ce_dread_mid_tt: "Fixer la redoutabilité à 50."
 DI_ce_dread_add_tt: "Augmenter la redoutabilité de 1. Maintenez Maj pour 5 ou Ctrl pour 10. Ctrl l'emporte si les deux touches sont maintenues."
 DI_ce_dread_max_tt: "Fixer la redoutabilité à 100."
 DI_ce_tyranny_min_tt: "Fixer la tyrannie à 0."
 DI_ce_tyranny_subtract_tt: "Réduire la tyrannie de 1. Maintenez Maj pour 5 ou Ctrl pour 10. Ctrl l'emporte si les deux touches sont maintenues."
 DI_ce_tyranny_mid_tt: "Fixer la tyrannie à 500."
 DI_ce_tyranny_add_tt: "Augmenter la tyrannie de 1. Maintenez Maj pour 5 ou Ctrl pour 10. Ctrl l'emporte si les deux touches sont maintenues."
 DI_ce_tyranny_max_tt: "Fixer la tyrannie à 1000."
 DI_ce_visual_age_min_tt: "Fixer l'âge visuel des immortels à 1."
 DI_ce_visual_age_subtract_tt: "Réduire l'âge visuel des immortels de 1. Maintenez Maj pour 5 ou Ctrl pour 10. Ctrl l'emporte si les deux touches sont maintenues."
 DI_ce_visual_age_mid_tt: "Fixer l'âge visuel des immortels à 50."
 DI_ce_visual_age_add_tt: "Augmenter l'âge visuel des immortels de 1. Maintenez Maj pour 5 ou Ctrl pour 10. Ctrl l'emporte si les deux touches sont maintenues."
 DI_ce_visual_age_max_tt: "Fixer l'âge visuel des immortels à 100."
 DI_ce_stats_all: "Tous"
 DI_ce_stats_all_target: "Modification : tous les personnages épinglés"
 DI_ce_stats_all_tt: "Applique chaque action à tous les personnages de la liste des épinglés. Les vérifications de validité individuelles sont ignorées. Maj et Ctrl modifient toujours le pas."
 DI_ce_stats_legitimacy: "Légitimité"
 DI_ce_legitimacy_min_tt: "Fixer la légitimité à 0."
 DI_ce_legitimacy_subtract_tt: "Réduire la légitimité de 1. Maintenez Maj pour 10 ou Ctrl pour 100. S'arrête à 0. Ctrl est prioritaire."
 DI_ce_legitimacy_mid_tt: "Fixer la légitimité à 600."
 DI_ce_legitimacy_add_tt: "Augmenter la légitimité de 1. Maintenez Maj pour 10 ou Ctrl pour 100. Plafond de l'éditeur : 10 000. Ctrl est prioritaire."
 DI_ce_legitimacy_max_tt: "Fixer la légitimité à 1 500."
 DI_ce_lock_legitimacy_button_tt: "#Bold Clic gauche#! pour verrouiller le niveau de légitimité.\n#Bold Clic droit#! pour déverrouiller le niveau de légitimité."
 DI_ce_stats_stress: "Stress"
 DI_ce_stress_min_tt: "Fixer le stress à 0."
 DI_ce_stress_subtract_tt: "Réduire le stress de 1. Maintenez Maj pour 10 ou Ctrl pour 50. S'arrête à 0. Ctrl est prioritaire."
 DI_ce_stress_mid_tt: "Fixer le stress à 200."
 DI_ce_stress_add_tt: "Augmenter le stress de 1. Maintenez Maj pour 10 ou Ctrl pour 50. S'arrête à 300. Ctrl est prioritaire."
 DI_ce_stress_max_tt: "Fixer le stress à 300."
 DI_ce_stats_lock_stress_tt: "#Bold Clic gauche#! pour verrouiller le niveau de stress.\n#Bold Clic droit#! pour déverrouiller le niveau de stress."
