l_french:

 # AUTO-GENERATED building category labels
 DI_tm_district_primary_button_tt: "#Bold Clic gauche#! pour construire ce quartier ou régler son bâtiment principal sur le niveau sélectionné. Les conditions de type de quartier et d'emplacement s'appliquent.\n#Bold Clic droit#! pour supprimer ce quartier et tous ses bâtiments."
 DI_tm_holding_primary_button_tt: "#Bold Clic gauche#! pour définir le type de propriété et le niveau sélectionné du bâtiment principal.\n#Bold Clic droit#! pour ramener le bâtiment principal à son premier niveau. Le quartier de propriété est conservé."
 DI_tm_native_district_construction_tt: "#Bold Bâtiment initial requis :#! construisez manuellement le premier bâtiment de quartier ducal depuis le menu habituel de la propriété et attendez la fin de la construction.\n#Bold Clic gauche#! pour faire passer instantanément le quartier existant au type et au niveau sélectionnés.\n#Bold Clic droit#! pour supprimer ce quartier et ses bâtiments. Après la suppression, vous devrez de nouveau construire manuellement un bâtiment de quartier initial."
 DI_tm_resource_district_button_tt: "#Bold Bâtiment initial requis :#! construisez manuellement le premier bâtiment de quartier de ressource depuis le menu habituel de la propriété et attendez la fin de la construction.\n#Bold Clic gauche#! pour faire passer instantanément le quartier existant au type et au niveau sélectionnés.\n#Bold Clic droit#! pour supprimer ce quartier et ses bâtiments. Après la suppression, vous devrez de nouveau construire manuellement un bâtiment de quartier initial."
 DI_tm_level_max: "Max"
 DI_tm_building_tooltip_separator: "\n\n"
 DI_tm_district_building_heading: "Bâtiment de quartier"
 DI_tm_internal_buildings_heading: "Bâtiments internes"
 DI_tm_level_selector: "Sélecteur de niveau"
 DI_tm_building_button_tt: "#Bold Clic gauche#! pour construire cette chaîne de bâtiments au niveau sélectionné ci-dessus.\n#Bold Clic droit#! pour détruire cette chaîne de bâtiments."
 DI_tm_set_settlement_size_tt: "#Bold Clic gauche#! pour régler la taille de localité des provinces sélectionnées sur le niveau choisi ci-dessus. Les provinces vides sont ignorées.\nEnsuite, la croissance ou le déclin mensuel s'applique normalement."
