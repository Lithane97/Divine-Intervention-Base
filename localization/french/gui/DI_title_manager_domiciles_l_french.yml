l_french:
 DI_dm_tab:0 "Domiciles"
 DI_dm_load_pinned:0 "Charger les personnages épinglés"
 DI_dm_load_self:0 "Mes domiciles"
 DI_dm_refresh:0 "Actualiser"
 DI_dm_select_all:0 "Tout sélectionner"
 DI_dm_clear:0 "Effacer la sélection"
 DI_dm_counts:0 "Sélectionnés : [GetPlayer.MakeScope.Var('DI_dm_selected_count').GetValue] / [GetPlayer.MakeScope.Var('DI_dm_candidate_count').GetValue] | Affichés : [GetPlayer.MakeScope.Var('DI_dm_shown_count').GetValue]"
 DI_dm_filter_all_loc:0 "Tous les types de domiciles"
 DI_dm_filter_help:0 "Filtrer la liste des domiciles chargés par type. Modifier le filtre conserve les sélections existantes, y compris celles qui sont masquées. Les actions affectent tous les domiciles sélectionnés."
 DI_dm_select_all_tt:0 "Remplacer la sélection actuelle par tous les domiciles affichés par le filtre actif."
 DI_dm_selection_help:0 "Cochez les domiciles à modifier. Les domiciles partagés ne sont affichés qu’une fois."
 DI_dm_upgrade:0 "Améliorer les bâtiments existants"
 DI_dm_upgrade_tt:0 "Améliorer instantanément les bâtiments existants des domiciles sélectionnés. S’arrête aux embranchements d’amélioration. N’ajoute aucun bâtiment intérieur et ne remplace aucun autre bâtiment. Ignore les domiciles ayant une construction en cours."
 DI_dm_construct_help:0 "Construire des bâtiments - choisir un type et un niveau"
 DI_dm_construct:0 "Construire des bâtiments"
 DI_dm_construction_title:0 "Construction du domicile"
 DI_dm_level_selector:0 "Niveau du bâtiment"
 DI_dm_level_selector_tt:0 "S’applique à tous les boutons de bâtiment. Max sélectionne le niveau le plus élevé. Les chaînes plus courtes que le niveau sélectionné utilisent leur niveau maximal disponible."
 DI_dm_level_max:0 "Max"
 DI_dm_last_action:0 "Dernière action : [GetPlayer.MakeScope.Var('DI_dm_changed_count').GetValue] modifications de bâtiments"
 DI_dm_construct_tt:0 "Clic gauche pour construire ou définir le niveau sélectionné, y compris un niveau inférieur. Clic droit pour supprimer le bâtiment sans remboursement ; le bâtiment principal revient au niveau 1. Supprimer un bâtiment extérieur supprime ses bâtiments intérieurs. Les domiciles occupés par une construction ou incompatibles sont ignorés. Les conditions de construction du jeu restent applicables lors de l’ajout de bâtiments."
 DI_dm_building_actions_tt:0 "Clic gauche : définir le niveau sélectionné (construire, améliorer ou rétrograder).\nClic droit : supprimer ce bâtiment sans remboursement. Supprimer un bâtiment parent supprime aussi ses bâtiments intérieurs.\nUne rétrogradation peut réduire la capacité en emplacements intérieurs.\n\n"
 DI_dm_main_building_actions_tt:0 "Clic gauche : définir le niveau sélectionné (améliorer ou rétrograder).\nClic droit : ramener le bâtiment principal au niveau 1 sans remboursement.\nUne rétrogradation peut réduire la capacité en emplacements intérieurs.\n\n"
 DI_dm_slot_main:0 "Bâtiment principal"
 DI_dm_slot_external:0 "Bâtiments extérieurs"
 DI_dm_slot_internal:0 "Bâtiments intérieurs"
 DI_dm_filter_type_camp_loc:0 "[GetDomicileType('camp').GetNameNoTooltip]"
 DI_dm_filter_type_east_asian_estate_loc:0 "[GetDomicileType('east_asian_estate').GetNameNoTooltip]"
 DI_dm_filter_type_ecclesiastical_domicile_loc:0 "[GetDomicileType('ecclesiastical_domicile').GetNameNoTooltip]"
 DI_dm_filter_type_estate_loc:0 "[GetDomicileType('estate').GetNameNoTooltip]"
 DI_dm_filter_type_japanese_manor_loc:0 "[GetDomicileType('japanese_manor').GetNameNoTooltip]"
 DI_dm_filter_type_yurt_loc:0 "[GetDomicileType('yurt').GetNameNoTooltip]"
