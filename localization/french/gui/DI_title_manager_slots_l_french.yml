l_french:

 DI_tm_manage_slots: "Gérer les emplacements"
 DI_tm_manage_slots_tt: "Ouvrir la gestion des emplacements pour les provinces sélectionnées."
 DI_tm_slots_help: "S'applique aux provinces sélectionnées. Un clic gauche ajoute un bonus d'emplacement ; un clic droit retire un bonus d'emplacement ajouté par DI. Les emplacements de quartier dédiés ne peuvent qu'être retirés."
 DI_tm_slots_building: "Emplacements de bâtiment de quartier"
 DI_tm_slots_building_tt: "#Bold Clic gauche#! pour ajouter un emplacement de bâtiment de quartier.\n#Bold Clic droit#! pour retirer un bonus d'emplacement de bâtiment ajouté par DI. Inclut les bonus de l'ancien bouton Ajouter un emplacement de bâtiment."
 DI_tm_slots_standard: "Emplacements de quartier standard"
 DI_tm_slots_standard_tt: "#Bold Clic gauche#! pour ajouter un emplacement de quartier standard.\n#Bold Clic droit#! pour retirer un bonus d'emplacement de quartier standard ajouté par DI. Les quartiers qui dépassent la capacité disponible peuvent devenir inactifs."
 DI_tm_slots_special: "Retirer l'emplacement de quartier spécial"
 DI_tm_slots_special_tt: "Retire l'emplacement de quartier spécial, ainsi que son quartier et tous les bâtiments qu'il contient. Les provinces sans cet emplacement sont ignorées."
 DI_tm_slots_great: "Retirer l'emplacement de grand quartier"
 DI_tm_slots_great_tt: "Retire l'emplacement de grand quartier, ainsi que son quartier et tous les bâtiments qu'il contient. Les provinces sans cet emplacement sont ignorées."
 DI_tm_slots_entrepot: "Retirer l'emplacement de quartier d'entrepôt"
 DI_tm_slots_entrepot_tt: "Retire l'emplacement de quartier d'entrepôt, ainsi que son quartier et tous les bâtiments qu'il contient. Les provinces sans cet emplacement sont ignorées."
 DI_tm_slots_building_add_modifier: "Emplacements de bâtiment de quartier ajoutés"
 DI_tm_slots_building_remove_modifier: "Ajustement retiré des emplacements de bâtiment de quartier"
 DI_tm_slots_standard_add_modifier: "Emplacements de quartier standard ajoutés"
 DI_tm_slots_standard_remove_modifier: "Ajustement retiré des emplacements de quartier standard"
