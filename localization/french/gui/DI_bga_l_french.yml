l_french:
 # Divine Intervention - By God Alone additions
 DI_study_rite_interaction: "#color_yellow #bold (DI)#!#! Étudier le rite"
 DI_study_rite_interaction_desc: "Termine instantanément un complot Étude du rite visant ce personnage : vous apprenez tous les principes et toutes les doctrines de son rite, découvrez le principe de syncrétisme correspondant et choisissez d'adopter ou non ce rite."
 DI_study_rite_interaction_tt: "Ouvre l'événement de réussite de l'Étude du rite, appliqué au rite de ce personnage."
 DI_study_rite_not_playable_tt: "Seul un dirigeant jouable peut apprendre des principes et des doctrines."
 DI_study_rite_nothing_to_learn_tt: "Vous savez déjà tout ce que ce rite peut vous enseigner."
 DI_cardinal_interaction: "#color_yellow #bold (DI)#!#! Cardinalat"
 DI_cardinal_interaction_desc: "Nomme ce personnage au Collège des cardinaux, ou lui retire son cardinalat."
 DI_cardinal_option_appoint: "Nommer cardinal"
 DI_cardinal_option_remove: "Retirer le cardinalat"
 DI_cardinal_already_tt: "Détient déjà un cardinalat."
 DI_cardinal_faith_tt: "Sa foi doit disposer d'un Collège des cardinaux."
 DI_cardinal_government_tt: "Doit appartenir au clergé : gouvernement théocratique ou d'ordre sacré, ou sans terre, et ne pas être antipape."
 DI_cardinal_pope_tt: "Le pape doit diriger sa foi ou son rite."
 DI_cardinal_not_cardinal_tt: "Ne détient pas de cardinalat."
 DI_cardinal_appoint_tt: "Reçoit un cardinalat et devient un dirigeant ecclésiastique."
 DI_cardinal_remove_tt: "Perd son titre de cardinal."
 DI_change_government_ecclesiastical: "Ecclésiastique"
 DI_ce_stats_fulfillment: "Épanouissement spirituel"
 DI_ce_fulfillment_min_tt: "Fixer l'épanouissement spirituel à -100."
 DI_ce_fulfillment_subtract_tt: "Réduire l'épanouissement spirituel de 1. Maintenez Maj pour 5 ou Ctrl pour 10. S'arrête à -100. Ctrl est prioritaire.\nSans effet tant que la grâce divine est active."
 DI_ce_fulfillment_mid_tt: "Fixer l'épanouissement spirituel à 0."
 DI_ce_fulfillment_add_tt: "Augmenter l'épanouissement spirituel de 1. Maintenez Maj pour 5 ou Ctrl pour 10. S'arrête à 100. Ctrl est prioritaire."
 DI_ce_fulfillment_max_tt: "Fixer l'épanouissement spirituel à 100."
 DI_ce_grace_fulfillment_button_tt: "#Bold Clic gauche#! pour accorder la grâce divine : l'épanouissement spirituel ne peut plus diminuer.\n#Bold Clic droit#! pour retirer la grâce divine.\nAbaissez la valeur avant de l'accorder, car les baisses sont elles aussi bloquées."
 DI_divine_grace: "Grâce divine"
 DI_divine_grace_desc: "Aucun épanouissement spirituel n'est jamais perdu."
 DI_fe_personal_tenets_heading: "Principes personnels"
 DI_fe_personal_tenets_heading_tt: "Principes personnels du personnage sélectionné. Seuls les personnages jouables en ont."
 DI_fe_add_personal_tenet: "Ajouter un principe personnel"
 DI_fe_add_personal_tenet_tt: "Choisissez n'importe quel principe à ajouter aux principes personnels du personnage sélectionné. S'il n'y a plus d'emplacement libre, le principe le plus défavorable à son épanouissement spirituel est remplacé."
 DI_fe_remove_personal_tenet: "Retirer un principe personnel"
 DI_fe_remove_personal_tenet_tt: "Choisissez l'un des principes personnels du personnage sélectionné pour le retirer."
 DI_fe_personal_add_help: "Cliquez sur un principe pour l'ajouter comme principe personnel. La fenêtre reste ouverte pour vous permettre d'en ajouter plusieurs."
 DI_fe_personal_remove_help: "Seuls les principes personnels actuels du personnage sont listés. Cliquez sur l'un d'eux pour le retirer."
 DI_bga_study_rite.0001.b: "Le rite [target.GetRite.GetNameNoTooltip] me paraît plus sensé que mes propres usages..."
 DI_religion_show_rites_tt: "Afficher les rites de cette foi."
 DI_religion_faith_main_rite_tt: "Choisir cette foi avec son rite principal. Dépliez-la pour choisir un rite précis."
 DI_religion_main_rite: "(rite principal)"
