 DI_ca_mid_tt: "Fixer l'acceptation culturelle commune à 50 %."
 DI_ca_add_tt: "Augmenter l'acceptation culturelle commune de 1 point de pourcentage. Maintenez Maj pour 5 ou Ctrl pour 10. S'arrête à 100 %."
 DI_ca_max_tt: "Fixer l'acceptation culturelle commune à 100 %."
 DI_ca_change_reason: "Divine Intervention"
 DI_ca_primary_culture_heading: "Culture principale"
 DI_ca_secondary_culture_heading: "Culture secondaire"
 DI_ca_summary_no_character: "Sélectionnez un personnage ci-dessus pour afficher sa culture."
 DI_ca_summary_no_fascination: "Fascination actuelle : aucune"
