 DI_ca_heading: "Acceptation culturelle"
 DI_ca_help: "L'acceptation est commune aux deux cultures. Les modifications s'appliquent aux cultures des deux personnages sélectionnés ci-dessus."
 DI_ca_pair: "[GetPlayer.MakeScope.Var('DI_innovation_selected_char').Char.GetCulture.GetName] — [GetPlayer.MakeScope.Var('DI_innovation_selected_char_copy').Char.GetCulture.GetName]"
 DI_ca_value: "[Concept( 'cultural_acceptance', 'Acceptation' )|E] : [GetPlayer.MakeScope.Var('DI_innovation_selected_char').Char.GetCulture.GetAcceptance(GetPlayer.MakeScope.Var('DI_innovation_selected_char_copy').Char.GetCulture)|%/0V]"
 DI_ca_value_diff: "([GetPlayer.MakeScope.Var('DI_innovation_selected_char').Char.GetCulture.GetAcceptanceDiff(GetPlayer.MakeScope.Var('DI_innovation_selected_char_copy').Char.GetCulture)|1+=])"
 DI_ca_value_diff_tt: "#T Acceptation culturelle : [GetPlayer.MakeScope.Var('DI_innovation_selected_char').Char.GetCulture.GetAcceptance(GetPlayer.MakeScope.Var('DI_innovation_selected_char_copy').Char.GetCulture)|%/0]#!\n#weak Acceptation mutuelle entre [GetPlayer.MakeScope.Var('DI_innovation_selected_char').Char.GetCulture.GetName] et [GetPlayer.MakeScope.Var('DI_innovation_selected_char_copy').Char.GetCulture.GetName]#!\n\n[GetPlayer.MakeScope.Var('DI_innovation_selected_char').Char.GetCulture.GetYearlyAcceptanceChangeDesc(GetPlayer.MakeScope.Var('DI_innovation_selected_char_copy').Char.GetCulture)]\n\n[GetPlayer.MakeScope.Var('DI_innovation_selected_char').Char.GetCulture.GetAcceptanceBaselineDesc(GetPlayer.MakeScope.Var('DI_innovation_selected_char_copy').Char.GetCulture)]\n\n[GetPlayer.MakeScope.Var('DI_innovation_selected_char').Char.GetCulture.GetAcceptanceChangelog(GetPlayer.MakeScope.Var('DI_innovation_selected_char_copy').Char.GetCulture)]"
 DI_ca_status: "[GetPlayer.Custom('DI_ca_status_description')]"
 DI_ca_missing: "Sélectionnez deux personnages ayant une culture à l'aide des portraits ci-dessus."
 DI_ca_same: "Les deux personnages sélectionnés ont la même culture. Sélectionnez un personnage d'une autre culture."
 DI_ca_empty: ""
 DI_ca_min_tt: "Fixer l'acceptation culturelle commune à 0 %."
