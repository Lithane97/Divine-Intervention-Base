 DI_dip_abdication_description_text: "Destituer [GetPlayer.Custom('DI_flip_primary_character')] et régler la succession.[Localize('DI_dip_abdication_selection_conflicts_text')][Localize('DI_dip_abdication_status_conflicts_text')]"
