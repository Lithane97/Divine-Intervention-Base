l_french:
 ### Diplomacy ###
 DIAnd1: " et "
 DIAnd2: ""
 DIOf1: " de "
 DIOf2: ""
 # Primary Character #
 DI_primary_character_0: "Personnage principal"
 DI_primary_character_1: "[GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip]"
 DI_primary_character_2: ""
 # Secondary Character #
 DI_secondary_character_0: "Personnage secondaire"
 DI_secondary_character_1: "[GetPlayer.MakeScope.Var('DI_secondary_character').Char.GetNameNoTooltip]"
 # Tertiary Character #
 DI_tertiary_character_0: "Personnage tertiaire "
 DI_tertiary_character_1: "[GetPlayer.MakeScope.Var('DI_tertiary_character').Char.GetNameNoTooltip] "
 DI_tertiary_character_2: " "
 ### Family ###
 DIAdopt: "adopter "
 DIAdopts: "adopte "

 DI_father_check_1: "Rétablir le véritable père de [GetPlayer.Custom('DI_flip_primary_character')] comme son père."
 DI_father_check_2: "[GetPlayer.MakeScope.Var('DI_primary_character').Char.GetFather.GetNameNoTooltip] est défini comme le véritable père de [GetPlayer.Custom('DI_flip_primary_character')]."
 DI_betrothed_check_1: "[GetPlayer.Custom('DI_flip_primary_character')] rompt ses fiançailles."
 DI_betrothed_check_2: "[GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip] rompt ses fiançailles avec [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetBetrothed.GetNameNoTooltip]."

 DI_choose_primary_character: "\n#color_yellow Vous devez choisir un personnage principal.#!"
 DI_choose_secondary_character: "\n#color_yellow Vous devez choisir un personnage secondaire.#!"
 DI_choose_tertiary_character: "\n#color_yellow Vous devez choisir un personnage tertiaire.#!"
 DI_choose_primary_and_secondary_characters: "[Localize('DI_choose_primary_character')][Localize('DI_choose_secondary_character')]"
 DI_choose_primary_and_tertiary_characters: "[Localize('DI_choose_primary_character')][Localize('DI_choose_tertiary_character')]"

 ### Adoption Localization Strings ###
 DI_adoption_triggered_desc_1: "\n#color_yellow L'âge de [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip] doit être supérieur à celui de [GetPlayer.MakeScope.Var('DI_secondary_character').Char.GetNameNoTooltip].#!"
 DI_adoption_triggered_desc_2: "\n#color_yellow L'âge de [GetPlayer.MakeScope.Var('DI_tertiary_character').Char.GetNameNoTooltip] doit être supérieur à celui de [GetPlayer.MakeScope.Var('DI_secondary_character').Char.GetNameNoTooltip].#!"
 DI_adoption_triggered_desc_3: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip] et [GetPlayer.MakeScope.Var('DI_tertiary_character').Char.GetNameNoTooltip] sont déjà les parents de [GetPlayer.MakeScope.Var('DI_secondary_character').Char.GetNameNoTooltip].#!"
 DI_adoption_triggered_desc_4: "\n#color_yellow Impossible d'avoir deux parents de sexe masculin.#!"
 DI_adoption_triggered_desc_5: "\n#color_yellow Impossible d'avoir deux parents de sexe féminin.#!"

 ### Adoption House Localization Strings ###
 DI_adoption_house_triggered_desc_1: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_secondary_character').Char.GetNameNoTooltip] appartient déjà à la maison [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetHouse.GetBaseName].#!"

 ### Custom Cadet Branch Localization Strings ###
 DI_cadet_branch_triggered_desc_1: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip] ne doit pas être chef de dynastie.#!"
 DI_cadet_branch_triggered_desc_2: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip] ne doit pas être chef de maison.#!"
 DI_cadet_branch_triggered_desc_3: "[Localize('DI_cadet_branch_triggered_desc_1')][Localize('DI_cadet_branch_triggered_desc_2')]"

 ### Custom Pregnancy Localization Strings ###
 DI_pregnancy_triggered_desc_1: "\n#color_yellow Les deux personnages ne peuvent pas être de sexe masculin.#!"
 DI_pregnancy_triggered_desc_2: "\n#color_yellow Les deux personnages ne peuvent pas être de sexe féminin.#!"
 DI_pregnancy_triggered_desc_3: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip] doit être enceinte.#!"

 ### Custom Set Real Father Localization Strings ###
 DI_set_real_father_triggered_desc_1: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_secondary_character').Char.GetNameNoTooltip] est déjà le véritable père de [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip].#!"
 DI_set_real_father_triggered_desc_2: "\n#color_yellow Le véritable père doit être un homme.#!"
 DI_set_real_father_triggered_desc_3: "\n#color_yellow Le véritable père doit être plus âgé que l'enfant.#!"
 DI_set_father_as_real_father_triggered_desc_1: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip] n'a aucun père à rétablir.#!"
 DI_set_father_as_real_father_triggered_desc_2: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetFather.GetNameNoTooltip] est déjà le véritable père de [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip].#!"

 ### Custom Marry Localization Strings ###
 DI_marry_triggered_desc_1: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip] a déjà pour conjoint [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetPrimarySpouse.GetNameNoTooltip].#!"
 DI_marry_triggered_desc_2: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_tertiary_character').Char.GetNameNoTooltip] a déjà pour conjoint [GetPlayer.MakeScope.Var('DI_tertiary_character').Char.GetPrimarySpouse.GetNameNoTooltip].#!"
 DI_marry_triggered_desc_3: "[Localize('DI_marry_triggered_desc_1')][Localize('DI_marry_triggered_desc_2')]"

 ### Custom Concubine Localization Strings ###
 DI_add_concubine_triggered_desc_1: "\n#color_yellow Un personnage ne peut pas être son propre concubin.#!"
 DI_add_concubine_triggered_desc_2: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_tertiary_character').Char.GetNameNoTooltip] fait déjà partie des concubins de [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip].#!"
 DI_add_concubine_triggered_desc_3: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_tertiary_character').Char.GetNameNoTooltip] ne doit pas avoir de conjoint.#!"
 DI_add_concubine_triggered_desc_4: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_tertiary_character').Char.GetNameNoTooltip] ne doit pas avoir de fiançailles en cours.#!"
 DI_add_concubine_triggered_desc_5: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_tertiary_character').Char.GetNameNoTooltip] fait déjà partie des concubins de quelqu'un d'autre.#!"
 DI_remove_concubine_triggered_desc_1: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_tertiary_character').Char.GetNameNoTooltip] ne fait pas partie des concubins de [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip].#!"

 ### Custom Betrothal Localization Strings ###
 DI_betrothal_triggered_desc_1: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip] a déjà pour conjoint [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetPrimarySpouse.GetNameNoTooltip].#!"
 DI_betrothal_triggered_desc_2: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_tertiary_character').Char.GetNameNoTooltip] a déjà pour conjoint [GetPlayer.MakeScope.Var('DI_tertiary_character').Char.GetPrimarySpouse.GetNameNoTooltip].#!"
 DI_break_betrothal_triggered_desc_1: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip] n'a pas de fiançailles en cours.#!"

 ### Custom Divorce Localization Strings ###
 DI_divorce_triggered_desc_1: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip] n'a pas [GetPlayer.MakeScope.Var('DI_tertiary_character').Char.GetNameNoTooltip] pour conjoint.#!"

 ### Custom Make Siblings Localization Strings ###
 DI_make_siblings_triggered_desc_1: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip] et [GetPlayer.MakeScope.Var('DI_secondary_character').Char.GetNameNoTooltip] font déjà partie de la même fratrie.#!"
 DI_make_siblings_triggered_desc_2: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip] est l'un des parents de [GetPlayer.MakeScope.Var('DI_secondary_character').Char.GetNameNoTooltip].#!"
 DI_make_siblings_triggered_desc_3: "\n#color_yellow [GetPlayer.MakeScope.Var('DI_secondary_character').Char.GetNameNoTooltip] est l'un des parents de [GetPlayer.MakeScope.Var('DI_primary_character').Char.GetNameNoTooltip].#!"

### Diplomacy manager updates ###
 DI_dip_court_word: "cour"
 DI_dip_camp_word: "camp"
 DI_dip_empty_text: ""
 DI_dip_court_description_text: "Transférer [GetPlayer.Custom('DI_flip_secondary_character')] auprès de [GetPlayer.Custom('DI_flip_primary_character')] ([GetPlayer.Custom('DI_dip_court_or_camp')]) et à l'emplacement actuel de [GetPlayer.Custom('DI_flip_primary_character')].[Localize('DI_dip_court_selection_conflicts_text')][Localize('DI_dip_court_status_conflicts_text')][Localize('DI_dip_court_restriction_conflicts_text')]"
 DI_dip_tributary_description_text: "Rendre [GetPlayer.Custom('DI_flip_secondary_character')] tributaire de [GetPlayer.Custom('DI_flip_primary_character')].[Localize('DI_dip_tributary_selection_conflicts_text')][Localize('DI_dip_tributary_status_conflicts_text')][Localize('DI_dip_tributary_relationship_conflicts_text')]"
 DI_dip_break_vassalage_description_text: "Affranchir [GetPlayer.Custom('DI_flip_primary_character')] de son suzerain.[Localize('DI_dip_break_vassalage_selection_conflicts_text')][Localize('DI_dip_break_vassalage_status_conflicts_text')][Localize('DI_dip_break_vassalage_relationship_conflicts_text')]"
 DI_dip_break_tributary_description_text: "Mettre fin au statut de tributaire de [GetPlayer.Custom('DI_flip_primary_character')].[Localize('DI_dip_break_tributary_selection_conflicts_text')][Localize('DI_dip_break_tributary_status_conflicts_text')][Localize('DI_dip_break_tributary_relationship_conflicts_text')]"
