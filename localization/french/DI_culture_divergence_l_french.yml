 DI_cd_innovation_other: "Autres"
 DI_ch_title: "Créer une culture hybride"
 DI_cd_divergence_title: "Créer une culture divergente"
 DI_cd_divergence_help: "Vérifiez et modifiez ce brouillon avant de créer la nouvelle culture. La culture source reste inchangée. L'apparence et le style des noms sont hérités de la source."
 DI_ch_help: "Vérifiez et modifiez un hybride des deux cultures sélectionnées. Les deux cultures parentes restent inchangées. Le jeu détermine l'esthétique héritée lors de la création de l'hybride."
 DI_ch_secondary: "Seconde culture parente : [GetPlayer.MakeScope.Var('DI_cd_secondary').Culture.GetNameNoTooltip]"
 DI_cd_divergence_inherit: "Le brouillon reprend au départ les piliers, les traditions et les innovations découvertes de la culture source. Clic gauche sur une tradition ou une innovation pour l'ajouter ; clic droit pour la retirer. Les entrées en surbrillance sont incluses dans le brouillon."
 DI_ch_inherit: "Les piliers proviennent au départ de la culture principale. Les traditions et les innovations découvertes proviennent des deux cultures parentes. Clic gauche sur une tradition ou une innovation pour l'ajouter ; clic droit pour la retirer. Les entrées en surbrillance sont incluses dans le brouillon."
 DI_cd_divergence_name_default: "Néo-[GetPlayer.MakeScope.Var('DI_cd_source').Culture.GetNameNoTooltip]"
 DI_cd_divergence_collective_default: "Néo-[GetPlayer.MakeScope.Var('DI_cd_source').Culture.GetCollectiveNounNoTooltip]"
 DI_ch_name_default: "[GetPlayer.MakeScope.Var('DI_cd_source').Culture.GetNameNoTooltip]-[GetPlayer.MakeScope.Var('DI_cd_secondary').Culture.GetNameNoTooltip]"
 DI_ch_collective_default: "[GetPlayer.MakeScope.Var('DI_cd_source').Culture.GetCollectiveNounNoTooltip]-[GetPlayer.MakeScope.Var('DI_cd_secondary').Culture.GetCollectiveNounNoTooltip]"
 DI_ch_begin_tt: "Crée un brouillon d'hybride à partir de la culture principale en cours de modification et de la culture du personnage « Culture à copier ». Sélectionnez d'abord un personnage « Culture à copier » ayant une culture différente. Le personnage principal sélectionné est le fondateur."
 DI_cd_innovations_other_empty: "Aucune innovation n'appartient à d'autres ères. Toutes les innovations disponibles sont listées sous les onglets des ères nommées."
 DI_cd_selected_pillars: "Piliers sélectionnés"
 DI_ch_parent_pillars: "Piliers des cultures parentes"
 DI_ch_source_pillars: "Source : [GetPlayer.MakeScope.Var('DI_cd_source').Culture.GetNameNoTooltip]"
 DI_ch_parent_pillars_hint: "Cliquez sur un pilier parent pour l'utiliser dans le brouillon. Les piliers en surbrillance correspondent à la sélection actuelle."
