 DI_cd_adoption: "Le fondateur adopte la nouvelle culture"
 DI_cd_scope_help: "La création de cette culture suit les règles de conversion normales du jeu. Les comtés voisins éligibles et les personnages de la famille, de la cour et de la chaîne vassalique du fondateur peuvent l'adopter. Désactiver l'adoption par le fondateur préserve uniquement la culture du fondateur."
 DI_cd_finalize_tt: "Créer cette culture maintenant avec les paramètres du brouillon. Aucun prestige n'est dépensé. La création normale d'une culture peut aussi convertir des comtés et d'autres personnages éligibles. Annuler ne crée aucune culture."
 DI_cd_draft_selected: "Inclus dans le brouillon"
