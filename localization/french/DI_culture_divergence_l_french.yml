 DI_cd_martial_custom: "Coutume martiale"
 DI_cd_apply_name: "Appliquer"
 DI_cd_cancel_name: "Annuler"
 DI_cd_name_event_desc: "Saisissez la valeur pour la nouvelle culture. Appliquer l'enregistre dans le brouillon ; Annuler rétablit la valeur précédente."
