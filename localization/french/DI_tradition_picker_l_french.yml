 DI_tradition_picker_click_hint: "#I Clic gauche pour ajouter cette tradition.\nClic droit pour retirer cette tradition.#!"
 DI_tradition_picker_tooltip: "#T [CultureTradition.GetNameNoTooltip]#!\n[CultureTradition.GetEffectDescription(Culture.Self)]\n\n[CultureTradition.GetDescription(Culture.Self)|F]\n\n[Select_CString(GetPlayer.MakeScope.Var('DI_tradition_to_replace').IsSet, Localize('DI_tradition_picker_replace_hint'), Localize('DI_tradition_picker_click_hint'))]\n[Select_CString(GetScriptedGui('DI_tradition_dlc_available_sgui').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('tradition', CultureTradition.MakeScope).End), '', Localize('DI_tradition_picker_dlc_unavailable'))]"
