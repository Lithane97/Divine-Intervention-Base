l_korean:
 DI_dm_tab:0 "거처"
 DI_dm_load_pinned:0 "고정한 인물 불러오기"
 DI_dm_load_self:0 "내 거처"
 DI_dm_refresh:0 "새로 고침"
 DI_dm_select_all:0 "모두 선택"
 DI_dm_clear:0 "선택 해제"
 DI_dm_counts:0 "선택: [GetPlayer.MakeScope.Var('DI_dm_selected_count').GetValue] / [GetPlayer.MakeScope.Var('DI_dm_candidate_count').GetValue] | 표시: [GetPlayer.MakeScope.Var('DI_dm_shown_count').GetValue]"
 DI_dm_filter_all_loc:0 "모든 거처 유형"
 DI_dm_filter_help:0 "불러온 거처 목록을 유형별로 필터링합니다. 필터를 변경해도 숨겨진 거처를 포함한 기존 선택은 유지됩니다. 작업은 선택한 모든 거처에 적용됩니다."
 DI_dm_select_all_tt:0 "현재 선택을 활성 필터에 표시되는 모든 거처로 바꿉니다."
 DI_dm_selection_help:0 "편집할 거처를 선택하세요. 공유하는 거처는 한 번만 표시됩니다."
 DI_dm_upgrade:0 "기존 건물 개선"
 DI_dm_upgrade_tt:0 "선택한 거처의 기존 건물을 즉시 개선합니다. 개선 경로가 갈라지면 중단합니다. 내부 건물을 추가하거나 다른 건물을 교체하지 않습니다. 건설 중인 거처는 건너뜁니다."
 DI_dm_construct_help:0 "건물 건설 - 유형 및 단계 선택"
 DI_dm_construct:0 "건물 건설"
 DI_dm_construction_title:0 "거처 건설"
 DI_dm_level_selector:0 "건물 단계"
 DI_dm_level_selector_tt:0 "모든 건물 버튼에 적용됩니다. 최대를 선택하면 가장 높은 단계가 적용됩니다. 건물의 개선 단계 수가 선택한 단계보다 적으면 가능한 최고 단계를 사용합니다."
 DI_dm_level_max:0 "최대"
 DI_dm_last_action:0 "최근 작업: 건물 변경 [GetPlayer.MakeScope.Var('DI_dm_changed_count').GetValue]건"
 DI_dm_construct_tt:0 "좌클릭하면 건물을 건설하거나 선택한 단계로 설정하며, 단계 하향도 가능합니다. 우클릭하면 환불 없이 건물을 제거하며, 주 건물은 1단계로 초기화됩니다. 외부 건물을 제거하면 소속 내부 건물도 제거됩니다. 건설 중이거나 호환되지 않는 거처는 건너뜁니다. 건물을 추가할 때는 게임의 원래 건설 조건이 적용됩니다."
 DI_dm_building_actions_tt:0 "좌클릭: 선택한 단계로 설정합니다(건설, 개선 또는 하향).\n우클릭: 환불 없이 이 건물을 제거합니다. 상위 건물을 제거하면 소속 내부 건물도 제거됩니다.\n단계를 낮추면 내부 건물 슬롯 수가 줄어들 수 있습니다.\n\n"
 DI_dm_main_building_actions_tt:0 "좌클릭: 선택한 단계로 설정합니다(개선 또는 하향).\n우클릭: 환불 없이 주 건물을 1단계로 초기화합니다.\n단계를 낮추면 내부 건물 슬롯 수가 줄어들 수 있습니다.\n\n"
 DI_dm_slot_main:0 "주 건물"
 DI_dm_slot_external:0 "외부 건물"
 DI_dm_slot_internal:0 "내부 건물"
