 DI_fe_remove_personal_tenet: "Remove Personal Tenet"
 DI_fe_remove_personal_tenet_tt: "Pick one of the selected character's personal tenets to remove it."
 DI_fe_personal_add_help: "Click a tenet to add it as a personal tenet. The window stays open so you can add several."
 DI_fe_personal_remove_help: "Only the character's current personal tenets are listed. Click one to remove it."
 DI_bga_study_rite.0001.b: "The [target.GetRite.GetNameNoTooltip] rite makes more sense to me than my own ways..."
 DI_religion_show_rites_tt: "Show this faith's rites."
 DI_religion_faith_main_rite_tt: "Choose this faith with its main rite. Unfold it to choose a specific rite."
 DI_religion_main_rite: "(main rite)"
