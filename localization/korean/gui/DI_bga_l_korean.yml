l_korean:
 # Divine Intervention - By God Alone additions
 DI_study_rite_interaction: "#color_yellow #bold (DI)#!#! Study Rite"
 DI_study_rite_interaction_desc: "Instantly completes a Study Faith scheme against this character: you learn every tenet and doctrine of their rite, discover the matching syncretism tenet, and choose whether to also convert to it."
 DI_study_rite_interaction_tt: "Opens the Study Faith success event for this character's rite."
 DI_study_rite_not_playable_tt: "You must be a playable ruler to learn tenets and doctrines."
 DI_study_rite_nothing_to_learn_tt: "You already know everything this rite can teach you."
 DI_cardinal_interaction: "#color_yellow #bold (DI)#!#! Cardinalate"
 DI_cardinal_interaction_desc: "Appoints this character to the College of Cardinals, or removes their cardinalate."
 DI_cardinal_option_appoint: "Appoint as cardinal"
 DI_cardinal_option_remove: "Remove cardinalate"
 DI_cardinal_already_tt: "Already holds a cardinalate."
 DI_cardinal_faith_tt: "Their faith must have a College of Cardinals."
 DI_cardinal_government_tt: "Must be clergy: theocratic or holy order government, or unlanded, and not an antipope."
 DI_cardinal_pope_tt: "The Pope must lead their faith or rite."
 DI_cardinal_not_cardinal_tt: "Does not hold a cardinalate."
 DI_cardinal_appoint_tt: "Receives a cardinalate and becomes an ecclesiastical ruler."
 DI_cardinal_remove_tt: "Loses their cardinalate title."
 DI_change_government_ecclesiastical: "Ecclesiastical"
 DI_ce_stats_fulfillment: "Spiritual Fulfillment"
 DI_ce_fulfillment_min_tt: "Set spiritual fulfillment to -100."
 DI_ce_fulfillment_subtract_tt: "Decrease spiritual fulfillment by 1. Hold Shift for 5 or Control for 10. Stops at -100. Control takes precedence.\nHas no effect while Divine Grace is active."
 DI_ce_fulfillment_mid_tt: "Set spiritual fulfillment to 0."
 DI_ce_fulfillment_add_tt: "Increase spiritual fulfillment by 1. Hold Shift for 5 or Control for 10. Stops at 100. Control takes precedence."
 DI_ce_fulfillment_max_tt: "Set spiritual fulfillment to 100."
 DI_ce_grace_fulfillment_button_tt: "#Bold Left-Click#! to grant Divine Grace: spiritual fulfillment can no longer be lost.\n#Bold Right-Click#! to remove Divine Grace.\nLower the value before granting it, as decreases are blocked too."
 DI_divine_grace: "Divine Grace"
 DI_divine_grace_desc: "No spiritual fulfillment is ever lost."
 DI_fe_personal_tenets_heading: "Personal Tenets"
 DI_fe_personal_tenets_heading_tt: "Personal tenets of the selected character. Only playable characters have them."
 DI_fe_add_personal_tenet: "Add Personal Tenet"
