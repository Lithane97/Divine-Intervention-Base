l_korean:
 game_rule_category_DI_interface: "Divine Intervention"
 rule_DI_button_position: "Divine Intervention: 버튼 위치"
 setting_DI_button_position_sidebar: "오른쪽 열"
 setting_DI_button_position_sidebar_desc: "Divine Intervention 버튼을 기본 사이드바의 마지막으로 표시되는 버튼 아래에 배치합니다."
 setting_DI_button_position_new_column: "왼쪽 열"
 setting_DI_button_position_new_column_desc: "Divine Intervention 버튼을 사이드바 왼쪽의 별도 열에 배치합니다. 다른 인터페이스 모드가 기본 위치와 겹칠 때 사용하세요."
 DI_button_position_interaction: "#color_yellow #bold (DI)#!#! 메뉴 버튼 위치"
 DI_button_position_interaction_desc: "DI 설정에서 메뉴 버튼의 열을 선택합니다. 이 설정은 캠페인 게임 규칙보다 우선합니다. 기본 위치로 되돌리려면 게임 규칙 사용을 선택하세요."
 DI_button_position_use_rule: "게임 규칙 사용"
 DI_button_position_apply: "적용"
 DI_button_position_move_up: "한 간격 위로 이동"
 DI_button_position_move_up_desc: "작은 구분 간격을 건너뛰고 버튼 한 칸 위로 이동합니다. 맨 위에서 멈추며 선택한 열은 유지됩니다."
 DI_button_position_move_down: "한 간격 아래로 이동"
 DI_button_position_move_down_desc: "작은 구분 간격을 건너뛰고 버튼 한 칸 아래로 이동합니다. 기본 맨 아래 위치에서 멈추며 선택한 열은 유지됩니다."
 DI_button_position_move_top: "맨 위로 이동"
 DI_button_position_move_top_desc: "버튼 위의 모든 간격을 즉시 제거합니다. 선택한 열은 유지됩니다."
 DI_button_position_move_bottom: "맨 아래로 이동"
 DI_button_position_move_bottom_desc: "버튼 위의 모든 간격을 즉시 복원합니다. 선택한 열은 유지됩니다."
 DI_button_position_event_desc: "메뉴 버튼 위치를 조정합니다. 변경 사항은 즉시 적용되며 선택할 때마다 이 창이 다시 열려 계속 조정할 수 있습니다. 완료하면 닫기를 선택하세요. 게임 규칙 사용은 높이를 초기화하지 않고 캠페인의 기본 열을 복원합니다."
 DI_button_position_close: "닫기"
